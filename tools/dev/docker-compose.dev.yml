# Local development stand: the panel with demo data and live reload. Start it with `node tools/dev/dev.mjs`.
#   frontend  http://localhost:5173   (vite, hot reload of every change in src/core-frontend)
#   backend   http://localhost:3000   (restarts itself when a file in src/core-backend changes)
# The source code is mounted from the repository; node_modules live in Docker volumes (the Windows ones do not fit Linux).
name: coregsm-dev

x-dev-image: &dev-image
  build:
    context: .
    dockerfile: Dockerfile.dev
  image: coregsm-dev:node24

services:
  backend:
    <<: *dev-image
    working_dir: /app/src/core-backend
    # the first start installs the packages (a few minutes), the next ones begin at once
    command: sh -c "[ -x node_modules/.bin/tsx ] || npm ci --no-audit --no-fund; exec node /app/tools/dev/run-backend.mjs"
    environment:
      NODE_ENV: development
      PORT: "3000"
      DB_PATH: /data/coregsm.db
      # the same values the screenshot tool uses, so the demo data can be put in by tools/shots/seed.mjs
      JWT_SECRET: dev-jwt-secret-dev-jwt-secret-dev-jwt-secret
      INTERNAL_TOKEN: iiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiii
      SETUP_TOKEN: seed-code
      # the demo servers have made-up addresses: a poll would mark them offline, so it is almost switched off
      POLL_INTERVAL_SEC: "86400"
      APP_VERSION_NAME: dev
      LOG_LEVEL: info
    volumes:
      - ../../src/core-backend:/app/src/core-backend
      - backend-modules:/app/src/core-backend/node_modules
      - ../../tools:/app/tools
      - dev-data:/data
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 20s

  frontend:
    <<: *dev-image
    working_dir: /app/src/core-frontend
    command: sh -c "[ -x node_modules/.bin/vite ] || npm ci --no-audit --no-fund; exec npx vite --host 0.0.0.0 --port 5173 --strictPort"
    environment:
      COREGSM_API: http://backend:3000
      # files changed in Windows do not announce themselves inside the container: vite looks at them itself
      COREGSM_POLL: "1"
    volumes:
      - ../../src/core-frontend:/app/src/core-frontend
      - frontend-modules:/app/src/core-frontend/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-modules:
  frontend-modules:
  dev-data:
