<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoreGSM: главная, 10 вариантов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html { background: #15161c; }
body { margin: 0; color: #e8e9ef; font: 15px/1.5 'Golos Text', system-ui, sans-serif; }
a { color: inherit; text-decoration: none; }
.page-head { max-width: 1180px; margin: 0 auto; padding: 28px 0 8px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: end; }
.page-head h1 { margin: 0; font-size: 24px; font-weight: 800; }
.page-head p { margin: 4px 0 0; color: #9a9db0; font-size: 14px; }
.nav { display: flex; flex-wrap: wrap; gap: 6px; }
.nav a { padding: 5px 12px; border-radius: 999px; background: #23242d; color: #c8cad6; font-size: 13px; font-weight: 600; }
.nav a:hover { background: #343642; }
.v-label { max-width: 1180px; margin: 36px auto 10px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.v-num { font-weight: 800; font-size: 13px; padding: 2px 10px; border-radius: 999px; background: #5b4fe0; color: #fff; }
.v-name { font-weight: 800; font-size: 17px; }
.v-desc { color: #9a9db0; font-size: 13.5px; width: 100%; }
.frame { position: relative; width: 1180px; max-width: 100%; margin: 0 auto 8px; min-height: 780px; border-radius: 22px; overflow: hidden; isolation: isolate; box-shadow: 0 30px 80px -30px #000; }
body.single .page-head, body.single .v-label { display: none; }
body.single .frame { margin: 0 auto; }
body.single { background: #000; }

/* ---------- shared pieces ---------- */
.row { display: flex; align-items: center; }
.tabular { font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 0 3px #3ddc8433; flex: none; }
.dot.off { background: #ff5d6c; box-shadow: 0 0 0 3px #ff5d6c33; }
.emb { display: block; object-fit: contain; }
svg { display: block; }

/* ================= 1. Аврора ================= */
.v1 { background: #07080d; padding: 22px 26px 40px; }
.v1 .bg { position: absolute; inset: 0; z-index: -1;
  background: radial-gradient(70% 60% at 8% 0%, rgba(124,58,237,.75), transparent 64%), radial-gradient(60% 50% at 96% 12%, rgba(45,212,191,.5), transparent 64%), radial-gradient(70% 55% at 50% 60%, rgba(79,70,229,.28), transparent 70%), radial-gradient(70% 60% at 70% 108%, rgba(236,72,153,.45), transparent 68%); }
.v1 .bg::after { content: ''; position: absolute; inset: 0; opacity: .1; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>"); }
.v1 .glass { background: linear-gradient(160deg, rgba(255,255,255,.1), rgba(255,255,255,.035)); border: 1px solid rgba(255,255,255,.13); border-radius: 22px; backdrop-filter: blur(16px); box-shadow: 0 20px 50px -24px #000; }
.v1 .top { display: flex; align-items: center; gap: 22px; padding: 12px 18px; margin-bottom: 22px; }
.v1 .brand { font-weight: 800; font-size: 19px; }
.v1 .links { display: flex; gap: 4px; margin-right: auto; }
.v1 .links a { padding: 7px 14px; border-radius: 999px; color: #b6b9cc; font-weight: 600; font-size: 14px; }
.v1 .links a.on { background: rgba(255,255,255,.12); color: #fff; }
.v1 .btn { padding: 8px 16px; border-radius: 999px; background: #5b4fe0; font-weight: 700; font-size: 14px; }
.v1 .kpis { display: grid; grid-template-columns: 1.1fr repeat(4, auto) 1.4fr; gap: 30px; align-items: center; padding: 18px 24px; margin-bottom: 18px; }
.v1 .kpi small { display: block; color: #9ba0b8; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.v1 .kpi b { font-size: 30px; font-weight: 800; }
.v1 .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.v1 .card { padding: 16px; position: relative; overflow: hidden; }
.v1 .wm { position: absolute; right: -14px; bottom: -14px; width: 150px; opacity: .13; pointer-events: none; }
.v1 .hero { grid-column: span 3; display: grid; grid-template-columns: 1fr 1.5fr; gap: 24px; padding: 22px 26px; position: relative; overflow: hidden; }
.v1 .hero .wm { right: 42%; bottom: -30px; width: 250px; opacity: .1; }
.v1 .hero h2 { margin: 0; font-size: 22px; font-weight: 800; }
.v1 .big { font-size: 74px; font-weight: 800; line-height: 1; letter-spacing: -.03em; }
.v1 .bar { height: 7px; border-radius: 9px; background: rgba(255,255,255,.1); overflow: hidden; margin: 10px 0 6px; }
.v1 .bar i { display: block; height: 100%; border-radius: 9px; }
.v1 .name { font-weight: 700; font-size: 16px; margin: 10px 0 2px; }
.v1 .sub { color: #9ba0b8; font-size: 13px; }
.v1 .num { font-size: 32px; font-weight: 800; }

/* ================= 2. Командный центр ================= */
.v2 { background: #090c13; display: grid; grid-template-columns: 300px 1fr; }
.v2 .bg { position: absolute; inset: 0; z-index: -1; background-image: linear-gradient(rgba(110,140,255,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(110,140,255,.055) 1px, transparent 1px); background-size: 36px 36px; -webkit-mask-image: radial-gradient(120% 90% at 50% 0%, #000 30%, transparent 85%); mask-image: radial-gradient(120% 90% at 50% 0%, #000 30%, transparent 85%); }
.v2 .rail { border-right: 1px solid #1b2030; padding: 22px 16px; background: linear-gradient(180deg, #0c1018, #090c13); }
.v2 .brand { font-weight: 800; font-size: 19px; padding: 0 8px 18px; }
.v2 .rail h6 { margin: 14px 8px 8px; color: #6f7690; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }
.v2 .srv { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 9px 8px; border-radius: 12px; }
.v2 .srv.on { background: #141a2a; box-shadow: inset 0 0 0 1px #2a3350; }
.v2 .srv .t { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; }
.v2 .srv b { font-size: 13.5px; font-weight: 650; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
.v2 .srv small { color: #6f7690; font-size: 12px; }
.v2 .srv .n { font-weight: 800; font-size: 15px; }
.v2 .main { padding: 24px 28px 30px; display: grid; gap: 16px; align-content: start; }
.v2 .head { display: flex; justify-content: space-between; align-items: center; }
.v2 .head h2 { margin: 0; font-size: 24px; font-weight: 800; }
.v2 .pill { padding: 5px 12px; border-radius: 999px; background: #0f2a1f; color: #46e08f; font-size: 13px; font-weight: 700; }
.v2 .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.v2 .k { background: #0e1320; border: 1px solid #1b2236; border-radius: 16px; padding: 14px 16px; }
.v2 .k small { color: #6f7690; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }
.v2 .k b { display: block; font-size: 30px; font-weight: 800; margin-top: 2px; }
.v2 .k i { font-style: normal; color: #46e08f; font-size: 12.5px; font-weight: 700; }
.v2 .panel { background: #0e1320; border: 1px solid #1b2236; border-radius: 18px; padding: 16px 18px; }
.v2 .panel h4 { margin: 0 0 10px; font-size: 15px; font-weight: 750; display: flex; justify-content: space-between; }
.v2 .two { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
.v2 .ev { display: grid; grid-template-columns: 8px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid #1a2134; font-size: 13.5px; }
.v2 .ev:first-of-type { border-top: 0; }

/* ================= 3. Бенто ================= */
.v3 { background: #0a0a10; padding: 24px; }
.v3 .bg { position: absolute; inset: 0; z-index: -1; background: radial-gradient(70% 40% at 50% -6%, rgba(99,102,241,.35), transparent 70%), radial-gradient(rgba(255,255,255,.07) 1px, transparent 1.3px) 0 0 / 22px 22px; }
.v3 .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.v3 .top h2 { margin: 0; font-size: 26px; font-weight: 800; }
.v3 .top span { color: #8e92a8; font-size: 14px; }
.v3 .b { display: grid; grid-template-columns: repeat(6, 1fr); grid-auto-rows: 112px; gap: 14px; }
.v3 .t { border-radius: 26px; padding: 18px 20px; position: relative; overflow: hidden; background: #13141d; border: 1px solid #202233; }
.v3 .t h5 { margin: 0; color: #8e92a8; font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.v3 .t .v { font-size: 46px; font-weight: 800; line-height: 1.05; margin-top: 4px; letter-spacing: -.02em; }
.v3 .hero { grid-column: span 4; grid-row: span 3; background: linear-gradient(150deg, #5b4fe0, #2a1d7a); border: 0; }
.v3 .hero .v { font-size: 92px; }
.v3 .ring { display: grid; place-items: center; }
.v3 .srvt { grid-column: span 2; grid-row: span 2; }
.v3 .wide { grid-column: span 2; }
.v3 .srvt .wm { position: absolute; right: -10px; bottom: -16px; width: 130px; opacity: .16; }
.v3 .mini { display: flex; gap: 6px; margin-top: 12px; }
.v3 .mini i { width: 16px; height: 16px; border-radius: 6px; background: #3ddc84; }

/* ================= 4. Кино ================= */
.v4 { background: #07070a; }
.v4 .bgimg { position: absolute; inset: -40px; z-index: -1; background: url('../src/core-frontend/public/games/covers/m2o.jpg') center/cover; filter: blur(46px) saturate(1.3) brightness(.55); }
.v4 .top { position: relative; z-index: 3; display: flex; align-items: center; gap: 22px; padding: 18px 28px; }
.v4 .brand { font-weight: 800; font-size: 19px; margin-right: auto; }
.v4 .top a { color: #d6d6e2; font-weight: 600; font-size: 14px; opacity: .85; }
.v4 .heroimg { position: relative; height: 470px; margin-top: -62px; background: url('../src/core-frontend/public/games/covers/m2o.jpg') center 35%/cover; }
.v4 .heroimg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,7,10,.55) 0%, rgba(7,7,10,.1) 35%, rgba(7,7,10,.86) 100%), linear-gradient(90deg, rgba(7,7,10,.8), transparent 60%); }
.v4 .herotxt { position: absolute; left: 40px; bottom: 34px; right: 40px; z-index: 2; display: flex; justify-content: space-between; align-items: end; gap: 30px; }
.v4 .herotxt h2 { margin: 6px 0 0; font-size: 40px; font-weight: 800; letter-spacing: -.02em; max-width: 560px; line-height: 1.08; }
.v4 .tag { display: inline-flex; gap: 8px; align-items: center; padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,.14); backdrop-filter: blur(8px); font-size: 13px; font-weight: 650; }
.v4 .cnt { font-size: 100px; font-weight: 800; line-height: .9; letter-spacing: -.04em; }
.v4 .cnt small { font-size: 28px; font-weight: 600; color: #cfd0dc; letter-spacing: 0; }
.v4 .strip { display: flex; gap: 14px; padding: 18px 28px 28px; overflow: hidden; }
.v4 .c { flex: 1 1 0; min-width: 0; border-radius: 20px; padding: 14px 16px; background: rgba(18,18,24,.72); border: 1px solid rgba(255,255,255,.09); backdrop-filter: blur(12px); }
.v4 .c b { display: block; font-size: 14.5px; font-weight: 700; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v4 .c .n { font-size: 30px; font-weight: 800; }
.v4 .stats { display: flex; gap: 34px; padding: 4px 40px 0; color: #c9cadb; }
.v4 .stats b { color: #fff; font-size: 20px; font-weight: 800; margin-right: 6px; }

/* ================= 5. Терминал ================= */
.v5 { background: #050807; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13.5px; padding: 22px 26px; color: #b8e6cd; }
.v5 .bg { position: absolute; inset: 0; z-index: -1; background: repeating-linear-gradient(0deg, rgba(61,220,132,.04) 0 1px, transparent 1px 3px), radial-gradient(90% 70% at 50% 0%, rgba(61,220,132,.1), transparent 70%); }
.v5 .top { display: flex; gap: 18px; align-items: center; padding-bottom: 14px; border-bottom: 1px dashed #1f3a2b; margin-bottom: 18px; }
.v5 .top b { color: #3ddc84; font-size: 16px; margin-right: auto; }
.v5 .top a { color: #7fb898; } .v5 .top a.on { color: #3ddc84; }
.v5 .kp { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.v5 .kp div { border: 1px solid #1f3a2b; padding: 12px 14px; background: rgba(61,220,132,.04); }
.v5 .kp small { color: #5e8a72; display: block; letter-spacing: .1em; }
.v5 .kp b { color: #3ddc84; font-size: 32px; font-weight: 600; }
.v5 table { width: 100%; border-collapse: collapse; }
.v5 th { text-align: left; color: #5e8a72; font-weight: 500; letter-spacing: .1em; font-size: 12px; padding: 8px 10px; border-bottom: 1px solid #1f3a2b; }
.v5 td { padding: 12px 10px; border-bottom: 1px dashed #17291f; vertical-align: middle; }
.v5 tr:hover td { background: rgba(61,220,132,.05); }
.v5 .bar { height: 8px; width: 120px; background: #10201a; display: inline-block; vertical-align: middle; margin-right: 8px; }
.v5 .bar i { display: block; height: 100%; background: #3ddc84; }
.v5 .cmd { margin-top: 20px; color: #5e8a72; }
.v5 .cmd b { color: #3ddc84; font-weight: 500; }
.v5 .blink { display: inline-block; width: 8px; height: 15px; background: #3ddc84; vertical-align: -2px; }

/* ================= 6. Светлая редакция ================= */
.v6 { background: #f4f1ec; color: #1a1a22; padding: 26px 32px 40px; }
.v6 .bg { position: absolute; inset: 0; z-index: -1; background: radial-gradient(40% 40% at 8% 6%, #ffd9c2, transparent 70%), radial-gradient(38% 40% at 94% 12%, #d9d4ff, transparent 70%), radial-gradient(40% 40% at 70% 100%, #c8f2e1, transparent 70%); }
.v6 .bg::after { content: ''; position: absolute; inset: 0; opacity: .35; mix-blend-mode: multiply; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .5 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>"); }
.v6 .top { display: flex; align-items: center; gap: 22px; margin-bottom: 30px; }
.v6 .brand { font-weight: 800; font-size: 20px; margin-right: auto; }
.v6 .top a { font-weight: 650; color: #55556a; font-size: 14px; } .v6 .top a.on { color: #1a1a22; border-bottom: 2px solid #1a1a22; padding-bottom: 2px; }
.v6 h1 { margin: 0; font-size: 72px; line-height: .95; font-weight: 800; letter-spacing: -.04em; }
.v6 .lead { display: grid; grid-template-columns: 1.2fr 1fr; gap: 30px; align-items: end; margin-bottom: 30px; }
.v6 .lead p { margin: 12px 0 0; color: #6a6a80; font-size: 16px; max-width: 420px; }
.v6 .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.v6 .stats div { background: rgba(255,255,255,.7); border-radius: 18px; padding: 12px 14px; }
.v6 .stats small { color: #77778c; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.v6 .stats b { display: block; font-size: 28px; font-weight: 800; }
.v6 .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.v6 .card { background: #fff; border-radius: 26px; padding: 18px; box-shadow: 0 14px 40px -22px rgba(40,30,80,.35); position: relative; overflow: hidden; }
.v6 .card::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--c); }
.v6 .card .head { display: flex; gap: 12px; align-items: center; margin-top: 4px; }
.v6 .card .t { width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 14%, #fff); }
.v6 .card b.nm { font-size: 16px; font-weight: 750; line-height: 1.2; }
.v6 .card .g { color: #85859a; font-size: 13px; }
.v6 .card .num { font-size: 44px; font-weight: 800; letter-spacing: -.03em; margin-top: 10px; }
.v6 .card .num small { font-size: 18px; color: #85859a; font-weight: 600; }
.v6 .bar { height: 7px; border-radius: 8px; background: #efedf4; overflow: hidden; }
.v6 .bar i { display: block; height: 100%; background: var(--c); border-radius: 8px; }
.v6 .card .m { display: flex; justify-content: space-between; color: #85859a; font-size: 13px; margin-top: 8px; }

/* ================= 7. Неон HUD ================= */
.v7 { background: #06030f; padding: 22px 28px 40px; font-weight: 600; }
.v7 .bg { position: absolute; inset: 0; z-index: -1; background: radial-gradient(60% 40% at 50% 62%, rgba(255,46,151,.3), transparent 70%), linear-gradient(180deg, #06030f 0%, #12062b 55%, #1c0840 100%); }
.v7 .sun { position: absolute; left: 50%; top: 610px; width: 330px; height: 330px; margin-left: -165px; border-radius: 50%; z-index: -1; background: linear-gradient(180deg, #ffe66d 0%, #ff4d9d 55%, #8a2be2 100%); filter: blur(1px); opacity: .85; -webkit-mask-image: repeating-linear-gradient(180deg, #000 0 20px, transparent 20px 26px); mask-image: repeating-linear-gradient(180deg, #000 0 20px, transparent 20px 26px); }
.v7 .floor { position: absolute; left: -20%; right: -20%; bottom: 0; height: 52%; z-index: -1; background-image: linear-gradient(rgba(0,238,255,.55) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(0,238,255,.55) 1.5px, transparent 1.5px); background-size: 64px 64px; transform: perspective(380px) rotateX(62deg); transform-origin: top; -webkit-mask-image: linear-gradient(180deg, transparent, #000 40%); mask-image: linear-gradient(180deg, transparent, #000 40%); }
.v7 .top { display: flex; gap: 22px; align-items: center; margin-bottom: 26px; }
.v7 .brand { font-weight: 800; font-size: 20px; letter-spacing: .08em; text-transform: uppercase; margin-right: auto; text-shadow: 0 0 18px #ff2e97; }
.v7 .top a { color: #9fe9ff; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; } .v7 .top a.on { color: #fff; text-shadow: 0 0 12px #00eeff; }
.v7 .kp { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 22px; }
.v7 .kp div { padding: 14px 18px; border-radius: 14px; background: rgba(8,4,30,.7); box-shadow: 0 0 0 1px rgba(0,238,255,.55), 0 0 28px rgba(0,238,255,.22); }
.v7 .kp small { color: #8fe9ff; letter-spacing: .14em; text-transform: uppercase; font-size: 11.5px; }
.v7 .kp b { display: block; font-size: 36px; text-shadow: 0 0 20px #00eeff; }
.v7 .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.v7 .card { padding: 14px 16px; border-radius: 16px; background: rgba(8,4,30,.93); box-shadow: 0 0 0 1px var(--c), 0 0 26px color-mix(in srgb, var(--c) 40%, transparent); }
.v7 .card .nm { font-weight: 750; font-size: 14.5px; margin: 8px 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v7 .card .num { font-size: 40px; font-weight: 800; color: #fff; text-shadow: 0 0 18px var(--c); }
.v7 .card .num small { font-size: 16px; color: #b8b2e0; text-shadow: none; }

/* ================= 8. Мозаика по играм ================= */
.v8 { background: #09090e; padding: 22px 26px 36px; }
.v8 .bg { position: absolute; inset: 0; z-index: -1; overflow: hidden; }
.v8 .bg i { position: absolute; width: 420px; height: 420px; border-radius: 50%; filter: blur(110px); opacity: .5; }
.v8 .top { display: flex; align-items: center; gap: 22px; margin-bottom: 22px; }
.v8 .brand { font-weight: 800; font-size: 19px; margin-right: auto; }
.v8 .top a { color: #c5c6d6; font-weight: 600; font-size: 14px; }
.v8 .tiles { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 190px; gap: 16px; }
.v8 .tile { border-radius: 28px; padding: 18px 20px; position: relative; overflow: hidden; color: #fff; background: linear-gradient(145deg, var(--c), color-mix(in srgb, var(--c) 45%, #000)); box-shadow: 0 24px 50px -26px var(--c); }
.v8 .tile .wm { position: absolute; right: -24px; bottom: -28px; width: 62%; opacity: .26; filter: brightness(1.7) saturate(.6); }
.v8 .tile .nm { font-weight: 750; font-size: 15px; line-height: 1.2; max-width: 80%; }
.v8 .tile .g { font-size: 12.5px; opacity: .8; }
.v8 .tile .num { position: absolute; left: 20px; bottom: 16px; font-size: 54px; font-weight: 800; letter-spacing: -.03em; line-height: 1; text-shadow: 0 4px 24px rgba(0,0,0,.25); }
.v8 .tile .num small { font-size: 18px; opacity: .8; font-weight: 600; letter-spacing: 0; }
.v8 .big { grid-column: span 2; grid-row: span 2; }
.v8 .big .num { font-size: 120px; }
.v8 .sum { grid-column: span 2; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); box-shadow: none; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; gap: 12px; }
.v8 .sum small { color: #a4a6bd; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; display: block; }

    <div class="tile big" style="--c:${busiest.c}"><img class="wm" src="${G}${busiest.img}" alt=""><div class="nm">${busiest.name}</div><div class="g">${busiest.game} · самый загруженный</div><div class="num">${busiest.p}<small> / ${busiest.max}</small></div></div>
    ${S.filter((s) => s !== busiest).slice(0, 4).map((s) => `<div class="tile" style="--c:${s.c}"><img class="wm" src="${G}${s.img}" alt=""><div class="nm">${s.name}</div><div class="g">${s.game}</div><div class="num">${s.p}<small> / ${s.max}</small></div></div>`).join('')}
    <div class="tile sum"><div><small>Игроков</small><b>${T.players}</b></div><div><small>Онлайн</small><b>${T.online}/${T.total}</b></div><div><small>Пинг</small><b>${T.ping}</b></div><div><small>Аптайм</small><b>${T.uptime}%</b></div></div>
    ${S.filter((s) => s !== busiest).slice(4).map((s) => `<div class="tile" style="--c:${s.c}"><img class="wm" src="${G}${s.img}" alt=""><div class="nm">${s.name}</div><div class="g">${s.game}</div><div class="num">${s.p}<small> / ${s.max}</small></div></div>`).join('')}
  </div></div>`;

V[9] = () => `<div class="frame v9"><div class="bg">${spark(total, 1180, 560, '#6d5cff', .55, 3).replace('height="560"', 'height="560" style="position:absolute;inset:0"')}</div>
  <div class="top"><span class="brand">CoreGSM</span>${['Серверы', 'Новости', 'Статус', 'Сообщество'].map((n) => `<a>${n}</a>`).join('')}</div>
  <div class="pulse"><div class="ptxt"><small>Сейчас играют</small><div class="n">${T.players}<span>игрока · 7 серверов</span></div></div>
    <div class="kp"><div><small>Пинг</small><b>${T.ping} мс</b></div><div><small>Аптайм</small><b>${T.uptime}%</b></div><div><small>Пик</small><b>150</b></div></div></div>
  <div class="list">${S.map((s) => `<div class="li"><span class="t" style="background:${s.c}26">${im(s, 30)}</span><div><b>${s.name}</b><small>${s.game} · ${s.map}</small></div><div><div class="bar"><i style="width:${pct(s)}%;background:${s.c}"></i></div></div><span style="color:#8d90a8;font-size:13px">${s.ping} мс</span><span class="n">${s.p}</span></div>`).join('')}</div></div>`;

V[10] = () => `<div class="frame v10"><div class="bg"></div>
  <div class="top"><span class="brand">CoreGSM</span>${NAV()}</div>
  <div class="hero"><div class="n">${T.players}</div><p>игроков онлайн прямо сейчас</p></div>
  <div class="inline"><span><b>${T.online}/${T.total}</b>серверов онлайн</span><span><b>${T.ping} мс</b>средний пинг</span><span><b>${T.uptime}%</b>аптайм 30 дней</span></div>
  <div>${S.map((s) => `<div class="ln"><i class="dot" style="background:${s.c};box-shadow:none"></i><div><b>${s.name}</b><div><small>${s.game}</small></div></div><div>${spark(s.series, 200, 28, s.c, .12, 1.6)}</div><span style="color:#77777f;font-size:13.5px">${s.ping} мс</span><span class="n">${s.p}<i> / ${s.max}</i></span></div>`).join('')}</div></div>`;

const NAMES = {
  1: ['Аврора', 'Тёмная «сетка света»: размытые цветные пятна и зерно на фоне, стеклянные карточки. Самый «живой» вариант без смены структуры; главный сервер — широкая карточка с графиком.'],
  2: ['Командный центр', 'Плотная панель оператора: список серверов слева, KPI и общий график сверху, события справа. Фон — чертёжная сетка. Для тех, у кого много серверов.'],
  3: ['Бенто', 'Мозаика плиток разных размеров (как у Apple): крупный «герой», KPI-плитки, кольцо аптайма. Фон — точечная сетка и мягкий свет сверху.'],
  4: ['Кино', 'Полноэкранная обложка самого живого сервера с огромным счётчиком; фон — её же размытая картинка. Остальные серверы лентой карточек.'],
  5: ['Терминал', 'Моноширинный «консольный» стиль, таблица вместо плиток, зелёный акцент, строки-сканлайны. Для админов, любящих плотность.'],
  6: ['Светлая редакция', 'Светлая бумага с цветными пятнами и зерном, крупная типографика, белые карточки с цветной полосой игры. Заметно отличается от остальных.'],
  7: ['Неон HUD', 'Ретровейв: сетка-горизонт, закат, неоновые рамки по цвету игры. Эффектно, но смелее всего.'],
  8: ['Мозаика по играм', 'Цветные плитки в цвете каждой игры с огромной эмблемой-водяным знаком; фон — размытые пятна тех же цветов.'],
  9: ['Пульс', 'Общий график игроков во весь экран как фон шапки, под ним стеклянный список серверов со шкалами. Главное — динамика.'],
  10: ['Минимализм', 'Огромная тонкая цифра «143», светлые линии вместо карточек, один мягкий прожектор на фоне. Самый спокойный и «дорогой».'],
};
const params = new URLSearchParams(location.search);
const only = Number(params.get('v'));
if (only) document.body.classList.add('single');
const root = document.getElementById('root');
const nav = document.getElementById('nav');
for (let i = 1; i <= 10; i++) {
  if (only && only !== i) continue;
  root.insertAdjacentHTML('beforeend', `<div class="v-label" id="v${i}"><span class="v-num">${i}</span><span class="v-name">${NAMES[i][0]}</span><span class="v-desc">${NAMES[i][1]}</span></div>${V[i]()}`);
  nav.insertAdjacentHTML('beforeend', `<a href="#v${i}">${i}. ${NAMES[i][0]}</a>`);
}
</script>
</body>
