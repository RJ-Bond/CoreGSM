<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoreGSM: админка, 8 вариантов</title>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html { background: #15161c; }
body { margin: 0; color: #e6e8f0; font: 14.5px/1.45 'Golos Text', system-ui, sans-serif; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
.head { max-width: 1180px; margin: 0 auto; padding: 26px 0 6px; }
.head h1 { margin: 0; font-size: 24px; font-weight: 800; }
.head p { margin: 4px 0 12px; color: #9a9db0; }
.nav { display: flex; flex-wrap: wrap; gap: 6px; }
.nav a { padding: 5px 12px; border-radius: 999px; background: #23242d; color: #c8cad6; font-size: 13px; font-weight: 600; }
.vl { max-width: 1180px; margin: 34px auto 10px; }
.vl .n { display: inline-block; font-weight: 800; font-size: 13px; padding: 2px 10px; border-radius: 999px; background: #5b4fe0; color: #fff; margin-right: 10px; }
.vl b { font-size: 17px; }
.vl p { margin: 4px 0 0; color: #9a9db0; font-size: 13.5px; }
body.single .head, body.single .vl { display: none; }
.frame { position: relative; width: 1180px; max-width: 100%; height: 780px; margin: 0 auto; border-radius: 20px; overflow: hidden; isolation: isolate; box-shadow: 0 30px 80px -30px #000; background: #090a0f; }
.frame.phone { width: 390px; height: 800px; border-radius: 38px; border: 8px solid #1b1c24; }
.bg { position: absolute; inset: 0; z-index: -1; background: radial-gradient(60% 50% at 5% 0%, rgba(88,91,235,.38), transparent 64%), radial-gradient(50% 44% at 98% 6%, rgba(45,212,191,.2), transparent 64%), radial-gradient(60% 50% at 70% 104%, rgba(236,72,153,.2), transparent 68%); }
:root { --card: rgba(21,23,31,.82); --line: rgba(255,255,255,.08); --mute: #8c90a6; --brand: #5b5ff0; --ok: #3ddc84; --bad: #ff5d6c; --warn: #f6b73c; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.pill.ok { background: rgba(61,220,132,.14); color: var(--ok); } .pill.bad { background: rgba(255,93,108,.14); color: var(--bad); } .pill.warn { background: rgba(246,183,60,.14); color: var(--warn); }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 11px; font-weight: 650; font-size: 13.5px; background: var(--brand); color: #fff; border: 0; cursor: pointer; }
.btn.s { background: rgba(255,255,255,.07); color: #dfe1ee; } .btn.g { background: transparent; color: var(--mute); }
.ib { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; background: rgba(255,255,255,.05); color: #b9bcd0; font-size: 14px; }
.ib.d { color: var(--bad); }
.search { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 11px; background: rgba(255,255,255,.05); border: 1px solid var(--line); color: var(--mute); min-width: 220px; }
.kbd { margin-left: auto; font-size: 11.5px; padding: 1px 6px; border-radius: 6px; background: rgba(255,255,255,.08); }
.ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.ico img { width: 24px; height: 24px; }
.brand { font-weight: 800; font-size: 17px; }
.mut { color: var(--mute); } .sm { font-size: 12.5px; }
.row { display: flex; align-items: center; } .gap8 { gap: 8px; } .gap12 { gap: 12px; } .sp { margin-left: auto; }
.logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #7c6cf6, #4a3fe0); display: grid; place-items: center; font-weight: 800; font-size: 14px; }
.tag { font-size: 11.5px; padding: 1px 8px; border-radius: 6px; background: rgba(255,255,255,.07); color: #b9bcd0; }

/* sidebar generic */
.side { display: flex; flex-direction: column; gap: 2px; }
.side h6 { margin: 12px 10px 4px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #6f7490; font-weight: 700; }
.side a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; color: #b3b6ca; font-weight: 550; }
.side a.on { background: rgba(91,95,240,.2); color: #fff; box-shadow: inset 0 0 0 1px rgba(91,95,240,.4); }
.side a i { width: 18px; text-align: center; font-style: normal; opacity: .85; }
.side a .b { margin-left: auto; font-size: 11.5px; background: var(--bad); color: #fff; border-radius: 999px; padding: 0 6px; }

/* table */
table { width: 100%; border-collapse: collapse; }
th { text-align: left; color: #6f7490; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; padding: 9px 12px; }
td { padding: 10px 9px; border-top: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
.pill { white-space: nowrap; }
.ellip { overflow: hidden; text-overflow: ellipsis; max-width: 185px; }
tr:hover td { background: rgba(255,255,255,.025); }
.spark svg { display: block; }
</style>
</head>
<body>
<div class="head"><h1>CoreGSM: админка, 8 вариантов</h1><p>Страница «Серверы» (и ещё несколько экранов) в разных подходах к навигации и плотности. Скажите номер, можно по частям («навигация из 2, список из 1»).</p><div class="nav" id="nav"></div></div>
<div id="root"></div>
<script>
const G = '../src/core-frontend/public/games/';
const S = [
  { n: 'Empire Bay RP | Mafia II Online', g: 'Mafia II: Online', c: '#c9a24a', i: 'm2o.png', p: 21, m: 32, ping: 38, addr: '203.0.113.10:27015', up: '99,9%', ok: 1 },
  { n: '[RU] Just-Skill.Ru | Standart PvE', g: 'V Rising', c: '#7c3aed', i: 'vrising.png', p: 27, m: 40, ping: 48, addr: '203.0.113.11:9876', up: '99,6%', ok: 1 },
  { n: 'Minecraft Survival', g: 'Minecraft: Java', c: '#62b543', i: 'minecraft.svg', p: 14, m: 40, ping: 31, addr: '203.0.113.12:25565', up: '100%', ok: 1 },
  { n: 'Rust | Vanilla x2', g: 'Rust', c: '#e0502d', i: 'rust.svg', p: 52, m: 100, ping: 44, addr: '203.0.113.13:28015', up: '99,8%', ok: 1 },
  { n: 'CS2 Retake', g: 'Counter-Strike 2', c: '#f0a020', i: 'counterstrike2.svg', p: 0, m: 0, ping: 0, addr: '203.0.113.14:27015', up: '92,1%', ok: 0 },
  { n: 'Palworld PvE', g: 'Palworld', c: '#2fc4bf', i: 'palworld.svg', p: 17, m: 32, ping: 52, addr: '203.0.113.15:8211', up: '99,9%', ok: 1 },
  { n: 'Valheim Co-op', g: 'Valheim', c: '#4d8fc7', i: 'valheim.svg', p: 3, m: 10, ping: 190, addr: '203.0.113.16:2456', up: '97,4%', ok: 2 },
];
const ser = (i, n = 40) => Array.from({ length: n }, (_, k) => 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(k / 5 + i)) * (0.92 + 0.08 * Math.sin(k * 2 + i)));
const spark = (v, w, h, c) => { const mx = Math.max(...v) * 1.1; const pts = v.map((y, i) => [(i / (v.length - 1)) * w, h - 2 - (y / mx) * (h - 4)]); let d = 'M' + pts[0]; for (let i = 1; i < pts.length; i++) { const cx = (pts[i - 1][0] + pts[i][0]) / 2; d += ` C${cx},${pts[i - 1][1]} ${cx},${pts[i][1]} ${pts[i][0]},${pts[i][1]}`; } return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${d}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/></svg>`; };
const ic = (s, w = 24) => `<span class="ico" style="background:${s.c}22"><img src="${G}${s.i}" width="${w}" height="${w}" alt=""></span>`;
const st = (s) => s.ok === 1 ? '<span class="pill ok">онлайн</span>' : s.ok === 2 ? '<span class="pill warn">лагает</span>' : '<span class="pill bad">не отвечает</span>';
const GROUPS = [['Основное', [['▤', 'Серверы', 7], ['◔', 'Discord'], ['◈', 'Новости']]], ['Мониторинг', [['♪', 'Оповещения'], ['⚒', 'Обслуживание'], ['▣', 'Карточки']]], ['Люди', [['☆', 'Сообщество'], ['☺', 'Пользователи'], ['≡', 'Журнал']]], ['Система', [['∿', 'Система'], ['⚙', 'Настройки']]]];
const side = (cur = 'Серверы', compact = false) => `<nav class="side">${compact ? '' : ''}${GROUPS.map(([t, a]) => `${compact ? '' : `<h6>${t}</h6>`}${a.map(([i, l, b]) => `<a class="${l === cur ? 'on' : ''}"><i>${i}</i>${compact ? '' : l}${!compact && b ? `<span class="b" style="background:${l === 'Серверы' ? '#ff5d6c' : '#555'}">${l === 'Серверы' ? '2' : ''}</span>`.replace(/<span class="b"[^>]*><\/span>/, '') : ''}</a>`).join('')}`).join('')}</nav>`;
const trow = (s, i, withSel = true) => `<tr>${withSel ? '<td style="width:34px"><input type="checkbox" style="accent-color:#5b5ff0"></td>' : ''}<td><div class="row gap12">${ic(s)}<div class="ellip"><b>${s.n}</b><div class="mut sm">${s.g} · ${s.addr}</div></div></div></td><td>${st(s)}</td><td class="mut tabular">${s.ok ? `${s.p}/${s.m}` : '—'}</td><td class="mut">${s.ok ? s.ping + ' мс' : '—'}</td><td>${s.up}</td><td class="spark">${spark(ser(i), 64, 24, s.c)}</td><td><div class="row gap8" style="justify-content:flex-end"><span class="ib" title="Привязать к Discord">◔</span><span class="ib" title="Опросить">↻</span><span class="ib" title="Изменить">✎</span><span class="ib d" title="Удалить">⌫</span></div></td></tr>`;
const V = {};

// 1. Таблица
V[1] = () => `<div class="frame"><div class="bg"></div><div style="display:grid;grid-template-columns:230px 1fr;height:100%">
<aside style="padding:18px 12px;border-right:1px solid var(--line);background:rgba(10,11,16,.55)"><div class="row gap8" style="padding:0 8px 10px"><span class="logo">C</span><span class="brand">CoreGSM</span></div>${side()}<div class="card" style="margin:16px 4px 0;padding:12px"><div class="row" style="justify-content:space-between"><b class="sm">Настройка</b><span class="sm mut">4 из 5</span></div><div style="height:6px;border-radius:6px;background:rgba(255,255,255,.08);margin-top:8px"><i style="display:block;width:80%;height:100%;border-radius:6px;background:var(--brand)"></i></div><div class="sm mut" style="margin-top:6px">Осталось: оформление</div></div></aside>
<main style="padding:22px 26px;overflow:hidden"><div class="row"><div><div class="mut sm">Основное / Серверы</div><h2 style="margin:2px 0 0;font-size:24px;font-weight:800">Серверы</h2></div><div class="sp row gap8"><div class="search">⌕ Найти сервер<span class="kbd">Ctrl K</span></div><button class="btn">＋ Добавить сервер</button></div></div>
<div class="row gap8" style="margin:16px 0 12px"><span class="pill ok" style="padding:5px 12px">Все · 7</span><span class="tag" style="padding:5px 12px">Онлайн · 5</span><span class="tag" style="padding:5px 12px;color:#ff8a94">Проблемы · 2</span><span class="sp mut sm">Выбрано 0</span><button class="btn s">Массовые действия ▾</button></div>
<div class="card" style="padding:4px 6px"><table><thead><tr><th></th><th>Сервер</th><th>Статус</th><th>Игроки</th><th>Пинг</th><th>Аптайм</th><th>24 ч</th><th></th></tr></thead><tbody>${S.map((s, i) => trow(s, i)).join('')}</tbody></table></div></main></div></div>`;

// 2. Иконный рейл
V[2] = () => `<div class="frame"><div class="bg"></div><div style="display:grid;grid-template-columns:68px 1fr;height:100%">
<aside style="padding:14px 0;border-right:1px solid var(--line);background:rgba(10,11,16,.6);display:flex;flex-direction:column;align-items:center;gap:6px"><span class="logo" style="margin-bottom:10px">C</span>${GROUPS.flatMap(([, a]) => a).map(([i, l]) => `<span class="ib" style="width:42px;height:42px;font-size:17px;${l === 'Серверы' ? 'background:rgba(91,95,240,.28);color:#fff;box-shadow:inset 0 0 0 1px rgba(91,95,240,.5)' : ''}" title="${l}">${i}</span>`).join('')}</aside>
<main style="padding:20px 28px;overflow:hidden"><div class="row"><div class="row gap8 mut sm"><span>Админка</span>›<span>Основное</span>›<b style="color:#fff">Серверы</b></div><div class="sp row gap8"><div class="search">⌕ Поиск по админке<span class="kbd">Ctrl K</span></div><span class="ib" style="background:rgba(91,95,240,.25)">A</span></div></div>
<div class="row" style="margin:18px 0 14px"><h2 style="margin:0;font-size:26px;font-weight:800">Серверы</h2><span class="tag" style="margin-left:10px">7</span><button class="btn sp">＋ Добавить сервер</button></div>
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px">${S.map((s, i) => `<div class="card" style="padding:14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center">${ic(s, 28).replace('34px', '42px').replace('34px', '42px')}<div style="min-width:0"><b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.n}</b><div class="mut sm">${s.g}</div><div class="row gap8" style="margin-top:6px">${st(s)}<span class="sm mut">${s.ok ? s.p + '/' + s.m : ''}</span></div></div><div style="text-align:right">${spark(ser(i), 80, 26, s.c)}<div class="row gap8" style="margin-top:6px;justify-content:flex-end"><span class="ib">✎</span><span class="ib">⋯</span></div></div></div>`).join('')}</div></main></div></div>`;

// 3. Верхние вкладки
V[3] = () => `<div class="frame"><div class="bg"></div><div style="padding:16px 34px">
<div class="row gap12"><span class="logo">C</span><span class="brand">CoreGSM</span><span class="tag">Админка</span><div class="sp row gap8"><div class="search">⌕ Найти<span class="kbd">Ctrl K</span></div><span class="ib" style="background:rgba(91,95,240,.25)">A</span></div></div>
<div class="row gap8" style="margin:18px 0 6px;padding-bottom:10px;border-bottom:1px solid var(--line)">${['Серверы', 'Discord', 'Новости', 'Мониторинг ▾', 'Люди ▾', 'Система ▾'].map((t, i) => `<span style="padding:7px 14px;border-radius:999px;font-weight:650;${i === 0 ? 'background:rgba(91,95,240,.22);color:#fff' : 'color:#a9adc2'}">${t}</span>`).join('')}</div>
<div class="row" style="margin:20px 0 14px"><div><h2 style="margin:0;font-size:28px;font-weight:800">Серверы</h2><div class="mut">Игровые серверы, которые показывает панель</div></div><button class="btn sp">＋ Добавить сервер</button></div>
<div style="display:grid;gap:8px">${S.map((s, i) => `<div class="card" style="padding:10px 14px;display:grid;grid-template-columns:44px 1.6fr 110px 90px 90px 110px 150px;gap:14px;align-items:center">${ic(s)}<div><b>${s.n}</b><div class="mut sm">${s.g} · ${s.addr}</div></div>${st(s)}<span class="mut">${s.ok ? s.p + '/' + s.m : '—'}</span><span class="mut">${s.ok ? s.ping + ' мс' : '—'}</span><span class="spark">${spark(ser(i), 90, 24, s.c)}</span><div class="row gap8" style="justify-content:flex-end"><button class="btn s" style="padding:6px 10px">Discord</button><span class="ib">✎</span><span class="ib d">⌫</span></div></div>`).join('')}</div></div></div>`;

// 4. Мастер-деталь
V[4] = () => `<div class="frame"><div class="bg"></div><div style="display:grid;grid-template-columns:210px 330px 1fr;height:100%">
<aside style="padding:18px 12px;border-right:1px solid var(--line);background:rgba(10,11,16,.55)"><div class="row gap8" style="padding:0 8px 8px"><span class="logo">C</span><span class="brand">CoreGSM</span></div>${side()}</aside>
<section style="padding:18px 14px;border-right:1px solid var(--line);overflow:hidden"><div class="row" style="margin-bottom:10px"><b style="font-size:17px">Серверы</b><button class="btn sp" style="padding:6px 10px">＋</button></div><div class="search" style="margin-bottom:10px">⌕ Найти</div>${S.map((s, i) => `<div class="row gap12" style="padding:9px 10px;border-radius:12px;${i === 3 ? 'background:rgba(91,95,240,.2);box-shadow:inset 0 0 0 1px rgba(91,95,240,.4)' : ''}">${ic(s)}<div style="min-width:0;flex:1"><b style="display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.n}</b><div class="mut sm">${s.g}</div></div><i style="width:9px;height:9px;border-radius:50%;background:${s.ok === 1 ? '#3ddc84' : s.ok === 2 ? '#f6b73c' : '#ff5d6c'}"></i></div>`).join('')}</section>
<main style="padding:22px 28px;overflow:hidden"><div class="row gap12">${ic(S[3], 30).replace('34px', '48px').replace('34px', '48px')}<div><h2 style="margin:0;font-size:22px;font-weight:800">Rust | Vanilla x2</h2><div class="mut">Rust · 203.0.113.13:28015</div></div><span class="sp">${st(S[3])}</span></div>
<div class="row gap8" style="margin:16px 0;border-bottom:1px solid var(--line)">${['Основное', 'Discord (2)', 'Оповещения', 'Обложка', 'Опасная зона'].map((t, i) => `<span style="padding:8px 12px;font-weight:650;${i === 0 ? 'border-bottom:2px solid #7a7ff5;color:#fff' : 'color:#9a9eb6'}">${t}</span>`).join('')}</div>
<div class="card" style="padding:18px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><label><div class="mut sm" style="margin-bottom:4px">Игра</div><div class="search" style="min-width:0">Rust <span class="kbd">▾</span></div></label><label><div class="mut sm" style="margin-bottom:4px">Название</div><div class="search" style="min-width:0">Rust | Vanilla x2</div></label><label><div class="mut sm" style="margin-bottom:4px">Адрес</div><div class="search" style="min-width:0">203.0.113.13</div></label><label><div class="mut sm" style="margin-bottom:4px">Порт</div><div class="search" style="min-width:0">28015</div></label></div><div class="row gap8" style="margin-top:16px"><button class="btn">Сохранить</button><button class="btn s">Проверить сервер</button><span class="mut sm sp">● Изменения сохраняются сразу</span></div></div></main></div></div>`;

// 5. Дашборд
V[5] = () => `<div class="frame"><div class="bg"></div><div style="display:grid;grid-template-columns:230px 1fr;height:100%">
<aside style="padding:18px 12px;border-right:1px solid var(--line);background:rgba(10,11,16,.55)"><div class="row gap8" style="padding:0 8px 10px"><span class="logo">C</span><span class="brand">CoreGSM</span></div>${side('Обзор')}</aside>
<main style="padding:22px 26px;overflow:hidden"><div class="row"><div><h2 style="margin:0;font-size:26px;font-weight:800">Добрый вечер, admin</h2><div class="mut">Сегодня всё спокойно, кроме двух серверов</div></div><div class="sp search">⌕ Что сделать?<span class="kbd">Ctrl K</span></div></div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0"><div class="card" style="padding:14px"><div class="mut sm">Серверов онлайн</div><b style="font-size:30px">5 из 7</b></div><div class="card" style="padding:14px"><div class="mut sm">Игроков</div><b style="font-size:30px">134</b></div><div class="card" style="padding:14px"><div class="mut sm">Бот</div><b style="font-size:20px;color:#f6b73c">нет токена</b></div><div class="card" style="padding:14px"><div class="mut sm">Диск</div><b style="font-size:30px">62%</b></div></div>
<div style="display:grid;grid-template-columns:1.3fr 1fr;gap:12px"><div class="card" style="padding:16px"><b>Требует внимания</b>${[['CS2 Retake: не отвечает 12 мин', 'Открыть', '#ff5d6c'], ['Valheim Co-op: высокий пинг 190 мс', 'Открыть', '#f6b73c'], ['Бот не подключён: добавьте токен', 'Указать', '#f6b73c'], ['Настройте оформление', 'Настроить', '#8c90a6']].map(([t, b, c]) => `<div class="row gap12" style="padding:11px 0;border-top:1px solid var(--line);margin-top:8px"><i style="width:9px;height:9px;border-radius:50%;background:${c}"></i><span>${t}</span><button class="btn s sp" style="padding:5px 10px">${b}</button></div>`).join('')}</div>
<div class="card" style="padding:16px"><b>Быстрые действия</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">${['＋ Сервер', '✎ Новость', '◔ Канал Discord', '⚒ Окно работ', '↓ Копия', '☺ Пользователи'].map((t) => `<div class="btn s" style="justify-content:flex-start;padding:11px">${t}</div>`).join('')}</div></div></div></main></div></div>`;

// 6. Настройки
