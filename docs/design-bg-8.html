<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoreGSM: варианты фона главной</title>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html { background: #15161c; }
body { margin: 0; color: #e6e8f0; font: 14.5px/1.45 'Golos Text', system-ui, sans-serif; }
.head { max-width: 1180px; margin: 0 auto; padding: 26px 0 6px; }
.head h1 { margin: 0; font-size: 24px; font-weight: 800; }
.head p { margin: 4px 0 12px; color: #9a9db0; }
.nav { display: flex; flex-wrap: wrap; gap: 6px; }
.nav a { padding: 5px 12px; border-radius: 999px; background: #23242d; color: #c8cad6; font-size: 13px; font-weight: 600; text-decoration: none; }
.vl { max-width: 1180px; margin: 34px auto 10px; }
.vl .n { display: inline-block; font-weight: 800; font-size: 13px; padding: 2px 10px; border-radius: 999px; background: #5b4fe0; color: #fff; margin-right: 10px; }
.vl b { font-size: 17px; } .vl p { margin: 4px 0 0; color: #9a9db0; font-size: 13.5px; }
body.single .head, body.single .vl { display: none; }
.frame { position: relative; width: 1180px; max-width: 100%; height: 760px; margin: 0 auto; border-radius: 20px; overflow: hidden; isolation: isolate; box-shadow: 0 30px 80px -30px #000; padding: 18px 28px; }
.bg { position: absolute; inset: 0; z-index: -1; }
/* the same page on every background */
:root { --card: rgba(21,23,31,.72); --line: rgba(255,255,255,.09); --mute: #8c90a6; }
.light { --card: rgba(255,255,255,.8); --line: rgba(20,20,60,.1); --mute: #6c7088; color: #171923; }
.top { display: flex; align-items: center; gap: 14px; padding: 9px 14px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); margin-bottom: 18px; }
.logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg,#7c6cf6,#4a3fe0); display: grid; place-items: center; font-weight: 800; color: #fff; }
.top b { font-weight: 800; font-size: 17px; margin-right: 8px; }
.top a { padding: 6px 13px; border-radius: 999px; font-weight: 650; color: var(--mute); }
.top a.on { background: rgba(127,127,160,.2); color: inherit; }
.btn { margin-left: auto; padding: 7px 15px; border-radius: 999px; background: #5b5ff0; color: #fff; font-weight: 700; }
.h1 { display: flex; align-items: center; gap: 12px; margin: 4px 0 14px; }
.h1 i { width: 44px; height: 44px; border-radius: 15px; background: linear-gradient(135deg,#6366f1,#4338ca); }
.h1 h2 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
.h1 span { color: var(--mute); }
.kpi { display: grid; grid-template-columns: 1.2fr repeat(4, auto) 1.3fr; gap: 26px; align-items: center; padding: 14px 20px; border-radius: 20px; background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.35); margin-bottom: 14px; }
.kpi small { display: block; color: var(--mute); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
.kpi b { font-size: 22px; font-weight: 800; }
.hero { position: relative; border-radius: 24px; padding: 20px 24px; height: 200px; margin-bottom: 14px; color: #fff; overflow: hidden; background: linear-gradient(135deg, #7a2a1f, #1e0d12); box-shadow: 0 24px 60px -28px #e0502d99; display: grid; grid-template-columns: 1fr 1.35fr; gap: 24px; }
.hero h3 { margin: 0; font-size: 24px; font-weight: 800; } .hero .big { font-size: 74px; font-weight: 800; letter-spacing: -.04em; line-height: 1; margin-top: 14px; }
.hero .pl { position: absolute; top: 18px; right: 20px; background: rgba(0,0,0,.4); border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 13px; }
.hero svg { width: 100%; height: 100%; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.tile { border-radius: 22px; padding: 12px; background: var(--card); border: 1px solid var(--line); }
.tile .cv { height: 92px; border-radius: 14px; margin-bottom: 10px; }
.tile b { display: block; font-size: 15px; } .tile .num { font-size: 30px; font-weight: 800; margin-top: 4px; } .tile .num small { color: var(--mute); font-size: 15px; }

/* 1 aurora (current) */
.b1 { background: #07080d; }
.b1 .bg { background: radial-gradient(70% 50% at 6% 0%, rgba(99,102,241,.5), transparent 100%), radial-gradient(55% 44% at 96% 6%, rgba(45,212,191,.3), transparent 100%), radial-gradient(60% 34% at 50% 46%, rgba(79,70,229,.12), transparent 100%), radial-gradient(60% 30% at 72% 66%, rgba(236,72,153,.26), transparent 100%); }
/* 2 dot grid + top light */
.b2 { background: #0a0b10; }
.b2 .bg { background: radial-gradient(60% 38% at 50% -4%, rgba(99,102,241,.38), transparent 100%), radial-gradient(rgba(255,255,255,.085) 1px, transparent 1.4px) 0 0 / 22px 22px; -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); }
/* 3 single spotlight */
.b3 { background: #08080b; }
.b3 .bg { background: radial-gradient(45% 36% at 50% 0%, rgba(255,255,255,.14), transparent 100%), radial-gradient(70% 50% at 50% 0%, rgba(120,120,160,.12), transparent 100%); }
/* 4 colour of the busiest server */
.b4 { background: #0b0809; }
.b4 .bg { background: radial-gradient(75% 55% at 50% 8%, rgba(224,80,45,.38), transparent 100%), radial-gradient(55% 40% at 90% 40%, rgba(224,80,45,.12), transparent 100%), linear-gradient(180deg, transparent 55%, rgba(0,0,0,.4)); }
/* 5 clean graphite with vignette */
.b5 { background: #101116; }
.b5 .bg { background: radial-gradient(120% 90% at 50% 0%, #1b1d27, transparent 100%), radial-gradient(130% 100% at 50% 50%, transparent 55%, rgba(0,0,0,.55)); }
/* 6 contour lines */
.b6 { background: #090b10; }
.b6 .bg { background: radial-gradient(60% 40% at 80% 0%, rgba(45,212,191,.2), transparent 100%), radial-gradient(60% 40% at 10% 10%, rgba(99,102,241,.25), transparent 100%); }
.b6 .bg::after { content: ''; position: absolute; inset: 0; opacity: .5; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='400' viewBox='0 0 600 400' fill='none' stroke='white' stroke-opacity='.07' stroke-width='1'><path d='M-20 80 C100 20 200 140 320 90 S520 40 640 100'/><path d='M-20 110 C100 50 200 170 320 120 S520 70 640 130'/><path d='M-20 140 C100 80 200 200 320 150 S520 100 640 160'/><path d='M-20 170 C100 110 200 230 320 180 S520 130 640 190'/><path d='M-20 200 C100 140 200 260 320 210 S520 160 640 220'/><path d='M-20 230 C100 170 200 290 320 240 S520 190 640 250'/><path d='M-20 260 C100 200 200 320 320 270 S520 220 640 280'/><path d='M-20 290 C100 230 200 350 320 300 S520 250 640 310'/><path d='M-20 320 C100 260 200 380 320 330 S520 280 640 340'/></svg>"); -webkit-mask-image: linear-gradient(#000, transparent 85%); mask-image: linear-gradient(#000, transparent 85%); }
/* 7 stars / dust */
.b7 { background: #06070c; }
.b7 .bg { background: radial-gradient(60% 45% at 20% 0%, rgba(124,58,237,.3), transparent 100%), radial-gradient(50% 40% at 90% 10%, rgba(14,165,233,.2), transparent 100%); }
.b7 .bg::after { content: ''; position: absolute; inset: 0; background-image: radial-gradient(1.2px 1.2px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 28% 62%, #fff9, transparent), radial-gradient(1.4px 1.4px at 44% 30%, #fff, transparent), radial-gradient(1px 1px at 63% 12%, #fff9, transparent), radial-gradient(1.2px 1.2px at 78% 48%, #fff, transparent), radial-gradient(1px 1px at 90% 80%, #fff9, transparent), radial-gradient(1px 1px at 8% 86%, #fff9, transparent), radial-gradient(1.3px 1.3px at 55% 74%, #fff, transparent), radial-gradient(1px 1px at 36% 92%, #fff9, transparent), radial-gradient(1px 1px at 96% 22%, #fff9, transparent); opacity: .55; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
/* 8 light pastel */
.b8 { background: #f4f5fa; }
.b8 .bg { background: radial-gradient(60% 46% at 6% 0%, rgba(129,140,248,.35), transparent 100%), radial-gradient(50% 40% at 96% 6%, rgba(45,212,191,.28), transparent 100%), radial-gradient(60% 34% at 72% 70%, rgba(244,114,182,.2), transparent 100%); }
.b8 .tile .cv { background: linear-gradient(135deg, #5a7d3a, #23361a); }
</style>
</head>
<body>
<div class="head"><h1>CoreGSM: варианты фона главной</h1><p>Одна и та же страница на 8 фонах. Скажите номер (можно «фон 2, но светлее»).</p><div class="nav" id="nav"></div></div>
<div id="root"></div>
<script>
const curve = (c) => { const pts = Array.from({ length: 50 }, (_, k) => [k / 49 * 520, 170 - (0.3 + 0.7 * Math.sin(k / 49 * Math.PI)) * 140 - Math.sin(k) * 2]); let d = 'M' + pts[0]; for (let i = 1; i < pts.length; i++) { const cx = (pts[i - 1][0] + pts[i][0]) / 2; d += ` C${cx},${pts[i - 1][1]} ${cx},${pts[i][1]} ${pts[i][0]},${pts[i][1]}`; } return `<svg viewBox="0 0 520 180" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${c}" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`; };
const tiles = [['Empire Bay RP | Mafia II', '21', '32', 'linear-gradient(135deg,#6b5320,#1d1608)'], ['[RU] Just-Skill.Ru | PvE', '27', '40', 'linear-gradient(135deg,#4a1d96,#150a2c)'], ['Minecraft Survival', '14', '40', 'linear-gradient(135deg,#3b7a2a,#13230d)']];
const page = (cls) => `<div class="frame ${cls}${cls === 'b8' ? ' light' : ''}"><div class="bg"></div>
<div class="top"><span class="logo">C</span><b>CoreGSM</b><a class="on">Серверы</a><a>Новости</a><a>Статус</a><a>Сообщество</a><span class="btn">Войти</span></div>
<div class="h1"><i></i><div><h2>Серверы</h2><span>Состояние ваших игровых серверов в реальном времени</span></div></div>
<div class="kpi"><div><b style="font-size:17px">Всё работает</b><small>7 серверов онлайн</small></div><div><small>Игроков</small><b>143</b></div><div><small>Онлайн</small><b>7/7</b></div><div><small>Пинг</small><b>43 мс</b></div><div><small>Аптайм</small><b>99,1%</b></div><div></div></div>
<div class="hero"><div><h3>Rust | Vanilla x2</h3><div style="opacity:.8;margin-top:2px">Rust · 203.0.113.13:28015</div><div class="big">52<span style="font-size:20px;font-weight:600;opacity:.8"> / 100 игроков</span></div></div><div class="pl">● Онлайн</div>${curve('#fff')}</div>
<div class="grid">${tiles.map(([n, p, m, g]) => `<div class="tile"><div class="cv" style="background:${g}"></div><b>${n}</b><div class="num">${p}<small> / ${m}</small></div></div>`).join('')}</div></div>`;
const NAMES = [
  ['Аврора (сейчас)', 'Четыре цветных пятна, теперь без обрыва внизу. Самый «цветной» вариант.'],
  ['Точечная сетка', 'Едва видные точки и мягкий свет сверху, снизу всё растворяется. Спокойный «технический» вид.'],
  ['Прожектор', 'Один мягкий белый свет сверху, без цвета. Максимально чисто, всё внимание на содержимом.'],
  ['Цвет главного сервера', 'Фон подстраивается под игру самого загруженного сервера (здесь Rust: тёплое красное). Меняется сам.'],
  ['Графит с виньеткой', 'Плоский тёмный фон со светлой серединой и затемнёнными краями. Без цвета и без шума.'],
  ['Контурные линии', 'Тонкие линии рельефа, как на карте, и два лёгких цветных пятна. Тематично для игровых карт.'],
  ['Звёздная пыль', 'Тёмное небо с редкими точками и фиолетово-голубым свечением. Атмосферный вариант.'],
  ['Светлая пастель', 'Светлая тема с мягкими цветными пятнами: так фон выглядел бы для посетителей со светлой темой.'],
];
const only = Number(new URLSearchParams(location.search).get('v')); if (only) document.body.classList.add('single');
const root = document.getElementById('root'), nav = document.getElementById('nav');
NAMES.forEach(([n, d], i) => { const k = i + 1; if (only && only !== k) return; root.insertAdjacentHTML('beforeend', `<div class="vl" id="v${k}"><span class="n">${k}</span><b>${n}</b><p>${d}</p></div>${page('b' + k)}`); nav.insertAdjacentHTML('beforeend', `<a href="#v${k}">${k}. ${n}</a>`); });
</script>
</body>
</html>
