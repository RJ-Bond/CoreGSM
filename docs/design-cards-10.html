<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CoreGSM: карточки серверов, 10 макетов</title>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html{background:#14151b}body{margin:0;color:#e6e8f0;font:14.5px/1.5 'Golos Text',system-ui,sans-serif}
.head{max-width:1240px;margin:0 auto;padding:30px 16px 6px}.head h1{margin:0;font-size:28px;font-weight:800}.head p{margin:6px 0;color:#9ea2b8}
.v{max-width:1240px;margin:34px auto 0;padding:0 16px}.v .n{display:inline-block;font-weight:800;font-size:13px;padding:2px 11px;border-radius:999px;background:#5b4fe0;color:#fff}.v h2{display:inline;margin:0 0 0 10px;font-size:20px}.v p{margin:6px 0 12px;color:#b9bccd}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:18px}
/* the card: 1200x480 scaled by container width */
.cw{container-type:inline-size;border-radius:18px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.c{position:relative;width:100%;aspect-ratio:1200/480;overflow:hidden;color:#fff;font-size:2.2cqw;--a:#8b5cf6}
.c *{margin:0}.big{font-weight:900;letter-spacing:-.04em;line-height:1}.mu{color:rgba(255,255,255,.62)}.mono{font-family:'JetBrains Mono',monospace}
.cover{position:absolute;inset:0;background:url(../src/core-frontend/public/games/covers/vrising.jpg) center/cover}
.pill{display:inline-flex;align-items:center;gap:.6cqw;padding:.4cqw 1.4cqw;border-radius:99px;font-weight:800;font-size:1.7cqw;background:rgba(61,220,132,.16);color:#5eead4}.pill:before{content:'';width:1.1cqw;height:1.1cqw;border-radius:50%;background:#3ddc84}
.bar{height:1.3cqw;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--a)}
.sp{position:absolute;right:3cqw;bottom:3cqw;left:auto;width:36cqw;height:15cqw}
.sp svg{width:100%;height:100%}
.ft{position:absolute;left:3cqw;right:3cqw;bottom:2cqw;display:flex;justify-content:space-between;font-size:1.6cqw;color:rgba(255,255,255,.5)}
.em{display:grid;place-items:center;border-radius:22%;background:rgba(139,92,246,.35);font-weight:900}
/* 1 */.k1{background:radial-gradient(80% 120% at 100% 0,#3b2a78,transparent),#0f1020}
.k1 .t{position:absolute;left:3cqw;top:3cqw;display:flex;gap:2cqw;align-items:center}.k1 .em{width:7cqw;height:7cqw;font-size:3cqw}.k1 h3{font-size:3.1cqw}.k1 .big{position:absolute;left:3cqw;top:15cqw;font-size:15cqw}.k1 .big small{font-size:4cqw;color:rgba(255,255,255,.5);font-weight:700;letter-spacing:0}.k1 .bar{position:absolute;left:3cqw;width:44cqw;top:33cqw}
.k1 .st{position:absolute;left:3cqw;top:37cqw;display:flex;gap:1.6cqw}.k1 .st div{padding:1cqw 2cqw;border-radius:1.4cqw;background:rgba(255,255,255,.07);font-size:1.7cqw}.k1 .st b{display:block;font-size:2.4cqw}
/* 2 */.k2 .cover{filter:saturate(1.1)}.k2:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,6,16,.92) 8%,rgba(6,6,16,.35) 70%,transparent)}
.k2 .in{position:absolute;z-index:2;left:4cqw;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:1.4cqw}.k2 h3{font-size:3.4cqw;max-width:40cqw}.k2 .big{font-size:18cqw}.k2 .big small{font-size:4cqw;color:rgba(255,255,255,.55);letter-spacing:0}
/* 3 */.k3{background:#f4f4f8;color:#14151f}.k3 .mu{color:#6b6f85}.k3 .in{position:absolute;inset:3.5cqw 4cqw;display:grid;grid-template-columns:1fr auto;align-items:end}.k3 h3{font-size:3cqw}.k3 .big{font-size:26cqw;color:#14151f}.k3 .big small{font-size:5cqw;color:#9a9eb3;letter-spacing:0}.k3 .bar{background:#dcdce8;width:100%;margin-top:2cqw}.k3 .pill{background:#d7f7e5;color:#0d7a46}.k3 .rt{text-align:right;font-size:1.8cqw;line-height:1.25;align-self:end}.k3 .rt b{display:block;font-size:2.6cqw;margin-bottom:1cqw}.k3 .big{font-size:22cqw}
/* 4 */.k4 .cover{filter:blur(3cqw) brightness(.55) saturate(1.3);transform:scale(1.2)}.k4 .g{position:absolute;inset:4cqw;border-radius:3cqw;background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 .15cqw rgba(255,255,255,.2);padding:3cqw;display:grid;grid-template-columns:1fr 1fr;gap:3cqw}.k4 h3{font-size:2.8cqw}.k4 .big{font-size:14cqw;margin-top:2cqw}.k4 .big small{font-size:3.6cqw;color:rgba(255,255,255,.55);letter-spacing:0}.k4 .sp2{align-self:center}
/* 5 */.k5{background:#06070b}.k5 .in{position:absolute;inset:3cqw}.k5 h3{font-size:2.6cqw;text-transform:uppercase;letter-spacing:.15em;color:#9aa}.k5 .led{display:flex;gap:1.4cqw;margin-top:3cqw}.k5 .led b{width:13cqw;height:19cqw;display:grid;place-items:center;border-radius:1.4cqw;background:#10131c;box-shadow:inset 0 0 0 .2cqw #1f2433,0 0 3cqw rgba(61,220,132,.18);font:700 15cqw/1 'JetBrains Mono';color:#3ddc84;text-shadow:0 0 2cqw rgba(61,220,132,.7)}.k5 .of{position:absolute;right:3cqw;top:12cqw;text-align:right;font-size:2.4cqw}.k5 .of b{display:block;font-size:6cqw}
/* 6 */.k6{background:linear-gradient(135deg,#171233,#0b0b18)}.k6 .ring{position:absolute;left:4cqw;top:50%;translate:0 -50%;width:34cqw;height:34cqw;border-radius:50%;background:conic-gradient(var(--a) 0 18%,rgba(255,255,255,.1) 0);display:grid;place-items:center}.k6 .ring:before{content:'';position:absolute;inset:3.4cqw;border-radius:50%;background:#100d24}.k6 .ring div{position:relative;text-align:center}.k6 .ring .big{font-size:10cqw}.k6 .in{position:absolute;left:43cqw;right:4cqw;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:1.6cqw}.k6 h3{font-size:3.2cqw}
/* 7 */.k7{background:#0f1020;display:grid;grid-template-columns:42% 1fr}.k7 .cv{position:relative;background:url(../src/core-frontend/public/games/covers/vrising.jpg) center/cover}.k7 .cv:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 50%,#0f1020)}.k7 .in{padding:4cqw 4cqw 4cqw 1cqw;display:flex;flex-direction:column;justify-content:center;gap:1.6cqw}.k7 h3{font-size:2.9cqw}.k7 .big{font-size:13cqw}.k7 .big small{font-size:3.6cqw;color:rgba(255,255,255,.5);letter-spacing:0}
/* 8 strip */.k8{aspect-ratio:1200/240;background:linear-gradient(90deg,#241a52,#0f1020 60%);display:flex;align-items:center;gap:3cqw;padding:0 4cqw}.k8 .em{width:10cqw;height:10cqw;font-size:4cqw}.k8 .nm{flex:1;min-width:0}.k8 h3{font-size:3cqw}.k8 .big{font-size:9cqw}.k8 .big small{font-size:3cqw;color:rgba(255,255,255,.5);letter-spacing:0}.k8 .bar{width:100%;margin-top:1cqw}
/* 9 people */.k9{background:#0f1020}.k9 .in{position:absolute;inset:3.5cqw 4cqw}.k9 h3{font-size:2.8cqw}.k9 .big{font-size:9cqw;position:absolute;right:0;top:0}.k9 .big small{font-size:3cqw;color:rgba(255,255,255,.5);letter-spacing:0}.k9 .ppl{position:absolute;left:0;right:0;top:15cqw;display:grid;grid-template-columns:repeat(4,1fr);gap:1.6cqw}.k9 .ppl div{display:flex;align-items:center;gap:1.4cqw;padding:1.4cqw;border-radius:2cqw;background:rgba(255,255,255,.07);font-size:2cqw;font-weight:700}.k9 .ppl i{width:5cqw;height:5cqw;border-radius:30%;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:2.4cqw}.k9 .bar{position:absolute;left:0;right:0;bottom:2cqw}
/* 10 state */.k10{background:linear-gradient(135deg,#0d3b2b,#0b1220 70%)}.k10 .in{position:absolute;inset:3.5cqw 4cqw;display:flex;flex-direction:column;justify-content:space-between}.k10 h3{font-size:3cqw}.k10 .big{font-size:20cqw}.k10 .big small{font-size:4cqw;color:rgba(255,255,255,.5);letter-spacing:0}.k10 .lbl{font-size:3.4cqw;font-weight:800;color:#5eead4}.k10 .bar{height:2cqw;background:rgba(255,255,255,.12)}.k10 .bar i{background:#3ddc84}
.k10 .sub{display:flex;justify-content:space-between;align-items:end}
</style></head><body>
<div class="head"><h1>Карточки серверов: 10 макетов</h1><p>Картинка 1200×480 (вариант 8 — полоса 1200×240), та же, что сейчас отдаёт <code>/api/card/ID.png</code> и использует бот Discord. Данные одинаковые: V Rising, 8 из 40, пинг 49, рекорд 34, аптайм 100%. Выберите номер (можно несколько, можно «взять из 2 и 6»).</p></div>
<script>
const spark=`<svg viewBox="0 0 360 150" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".5"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient></defs><path d="M0 120 L40 100 L80 105 L120 70 L160 80 L200 40 L240 60 L280 30 L320 50 L360 45 V150 H0Z" fill="url(#g)"/><path d="M0 120 L40 100 L80 105 L120 70 L160 80 L200 40 L240 60 L280 30 L320 50 L360 45" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linejoin="round"/></svg>`;
const stats=`<div class="st"><div class="mu">ПИНГ<b>49 мс</b></div><div class="mu">РЕКОРД 30 ДН<b>34</b></div><div class="mu">АПТАЙМ 24 Ч<b style="color:#5eead4">100%</b></div></div>`;
const T='[RU] Just-Skill.Ru | Standart PvE';
const V=[
['Классика+','Как сейчас, но крупнее: число — главный элемент, три показателя плашками, график справа с подсветкой.',
`<div class="c k1"><div class="t"><div class="em">V</div><div><h3>${T}</h3><div class="mu">V Rising · 1.0 · VRisingWorld</div></div></div><div class="big">8<small> / 40</small></div><div class="bar"><i style="width:20%"></i></div>${stats}<div class="sp">${spark}</div></div>`],
['Афиша','Обложка игры на всю карточку, слева затемнение, поверх огромное число игроков. Самый «игровой» вид.',
`<div class="c k2"><div class="cover"></div><div class="in"><span class="pill">ONLINE</span><h3>${T}</h3><div class="big">8<small> / 40 игроков</small></div><div class="mu">V Rising · пинг 49 мс · аптайм 100%</div></div></div>`],
['Светлая минимал','Светлый фон, огромная цифра и тонкая шкала. Хорошо смотрится на светлых сайтах и в светлом Discord.',
`<div class="c k3"><div class="in"><div><span class="pill">ONLINE</span><h3 style="margin-top:1.4cqw">${T}</h3><div class="big">8<small>/40</small></div><div class="bar"><i style="width:20%"></i></div></div><div class="rt mu">пинг<b>49 мс</b>рекорд<b>34</b></div></div></div>`],
['Стекло','Размытая обложка как фон, по центру матовая панель: слева число, справа график.',
`<div class="c k4"><div class="cover"></div><div class="g"><div><h3>${T}</h3><div class="mu">V Rising · ONLINE</div><div class="big">8<small> / 40</small></div></div><div class="sp2">${spark}</div></div></div>`],
['Табло','Тёмное табло с «светодиодными» цифрами: онлайн читается издалека, как счёт на стадионе.',
`<div class="c k5"><div class="in"><h3>${T}</h3><div class="led"><b>0</b><b>8</b></div><div class="of mu">из<b>40</b>игроков</div></div></div>`],
['Кольцо','Круговая шкала заполнения слева, справа название и показатели. Заполнение понятно с первого взгляда.',
`<div class="c k6"><div class="ring"><div><div class="big">8</div><div class="mu">из 40</div></div></div><div class="in"><h3>${T}</h3><span class="pill" style="align-self:flex-start">ONLINE</span><div class="mu">V Rising · пинг 49 мс</div><div class="mu">Рекорд 34 · аптайм 100%</div></div></div>`],
['Разделённая','Слева обложка, справа данные — по образцу большой карточки на сайте (то, что вам понравилось в «Серверах»).',
`<div class="c k7"><div class="cv"></div><div class="in"><h3>${T}</h3><span class="pill" style="align-self:flex-start">ONLINE</span><div class="big">8<small> / 40</small></div><div class="bar"><i style="width:20%"></i></div><div class="mu">пинг 49 мс · рекорд 34 · аптайм 100%</div></div></div>`],
['Полоса','Низкая карточка 1200×240 для подписей форума, шапок и сообщений в чате: иконка, название, число, шкала.',
`<div class="c k8"><div class="em">V</div><div class="nm"><h3>${T}</h3><div class="bar"><i style="width:20%"></i></div></div><div class="big">8<small> / 40</small></div></div>`],
['Кто играет','Акцент на людях: сверху число, ниже плашки ников с аватарами, внизу шкала. Для сообществ.',
`<div class="c k9"><div class="in"><h3>${T}</h3><div class="big">8<small> / 40</small></div><div class="ppl"><div><i style="background:#14b8a6">B</i>Brigitte</div><div><i style="background:#0ea5e9">S</i>Sydney</div><div><i style="background:#f97316">R</i>Ren</div><div class="mu">+5 ещё</div></div><div class="bar"><i style="width:20%"></i></div></div></div>`],
['Цвет состояния','Вся карточка тонируется по состоянию: зелёная — всё хорошо, жёлтая — почти полно, красная — недоступен. Статус виден без чтения.',
`<div class="c k10"><div class="in"><div><h3>${T}</h3><div class="mu">V Rising</div></div><div class="sub"><div class="big">8<small> / 40</small></div><div class="lbl">● СВОБОДНО</div></div><div class="bar"><i style="width:20%"></i></div></div></div>`],
];
document.body.insertAdjacentHTML('beforeend',V.map((v,i)=>`<div class="v"><span class="n">${i+1}</span><h2>${v[0]}</h2><p>${v[1]}</p><div style="max-width:760px"><div class="cw">${v[2]}</div></div></div>`).join('')+`<div class="v" style="margin-bottom:60px"><span class="n">+</span><h2>Страница «Карточки» в админке</h2><p>Для любого варианта: сетка станет крупнее (одна карточка в ряд на телефоне, две на планшете), под картинкой — переключатель размера и стиля, кнопки «Копировать ссылку», «Код для сайта (HTML)», «Скачать», подпись с временем обновления.</p></div>`);
</script></body></html>
