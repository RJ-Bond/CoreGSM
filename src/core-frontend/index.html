<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="manifest" href="/api/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="description" content="CoreGSM: мониторинг игровых серверов и сообщения для Discord" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CoreGSM" />
    <meta property="og:description" content="Мониторинг игровых серверов и сообщения для Discord" />
    <meta property="og:image" content="/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>CoreGSM</title>
    <script>
      // apply the saved theme before first paint to avoid a flash
      try {
        var t = localStorage.getItem('coregsm_theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
