<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="manifest" href="/api/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="description" content="CoreGSM: мониторинг игровых серверов и сообщения для Discord" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CoreGSM" />
    <meta property="og:description" content="Мониторинг игровых серверов и сообщения для Discord" />
    <meta property="og:image" content="/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>CoreGSM</title>
    <script>
      // apply the visitor's theme (or the community's default) before first paint to avoid a flash
      try {
        var t = localStorage.getItem('coregsm_theme') || localStorage.getItem('coregsm_theme_default') || 'dark';
        // the admin area has its own theme when one was chosen there
        if (location.pathname.indexOf('/admin') === 0) t = localStorage.getItem('coregsm_admin_theme') || t;
        // the schedule of the admin area: dark from 20:00 to 07:00 (NIGHT_FROM / NIGHT_TO in ui/theme.tsx)
        if (t === 'night') { var h = new Date().getHours(); t = h >= 20 || h < 7 ? 'dark' : 'light'; }
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        // the look (the own choice, else the community's default) and its accent: no flash from the classic look to Ember
        var own = localStorage.getItem('coregsm_look');
        if (own === '1' || (own !== '0' && localStorage.getItem('coregsm_look_default') === 'ember')) {
          document.documentElement.setAttribute('data-ember', '1');
          var acc = localStorage.getItem('coregsm_look_accent');
          if (acc === 'amber' || acc === 'coral' || acc === 'emerald') document.documentElement.setAttribute('data-ember-accent', acc);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
