name: coregsm

# keeps container logs from filling the disk
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# no service may gain privileges through setuid binaries; the Node services (backend, bot) need no Linux capabilities
# at all. The nginx containers keep the default capability set: nginx starts as root, binds port 80/443 and then
# hands the work to an unprivileged worker.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
x-hardening-node: &hardening-node
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# Memory ceilings: a runaway process is stopped (and restarted) instead of taking the whole host down. Raise one in
# .env when a large server needs more, e.g. BACKEND_MEM_LIMIT=3g. The backend decodes uploaded pictures (up to
# 12000x12000 pixels), which is what the default leaves room for.
services:
  backend:
    build:
      context: ./core-backend
      args:
        HTTP_PROXY: ${BUILD_PROXY:-}
        HTTPS_PROXY: ${BUILD_PROXY:-}
        NO_PROXY: localhost,127.0.0.1
    <<: *hardening-node
    mem_limit: ${BACKEND_MEM_LIMIT:-1536m}
    init: true
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      PORT: "3000"
      DB_PATH: /data/coregsm.db
      UPDATE_DIR: /update
      # public address of the panel: the trusted URL and the certificate check
      DOMAIN: ${DOMAIN}
      # the installer passes the new build id here while it starts the containers; .env gets it only
      # after the health check, so a failed update never looks like a finished one
      APP_VERSION: ${APP_VERSION:-}
    volumes:
      - coregsm-data:/data
      # update requests/status exchanged with the host updater (no Docker socket is exposed)
      - ./update:/update
    networks: [internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  bot:
    build:
      context: ./core-bot
      args:
        HTTP_PROXY: ${BUILD_PROXY:-}
        HTTPS_PROXY: ${BUILD_PROXY:-}
        NO_PROXY: localhost,127.0.0.1
    <<: *hardening-node
    mem_limit: ${BOT_MEM_LIMIT:-512m}
    init: true
    restart: unless-stopped
    logging: *logging
    environment:
      # the Discord token and proxy are configured in the web panel and fetched from the backend
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      BACKEND_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]
    # the bot touches this file every 10 seconds from its main loop (bot.ts); a stuck tick makes the bot exit by itself
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(Date.now()-process.getBuiltinModule('fs').statSync('/tmp/coregsm-bot.beat').mtimeMs<120000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./core-frontend
      args:
        HTTP_PROXY: ${BUILD_PROXY:-}
        HTTPS_PROXY: ${BUILD_PROXY:-}
        NO_PROXY: localhost,127.0.0.1
    <<: *hardening
    mem_limit: ${FRONTEND_MEM_LIMIT:-128m}
    init: true
    restart: unless-stopped
    logging: *logging
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx-proxy:
    build: ./nginx
    <<: *hardening
    mem_limit: ${PROXY_MEM_LIMIT:-256m}
    init: true
    restart: unless-stopped
    logging: *logging
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks: [internal]
    # port 80 answers as soon as nginx runs (no dependency on the backend)
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  certbot:
    image: certbot/certbot
    <<: *hardening
    mem_limit: ${CERTBOT_MEM_LIMIT:-256m}
    init: true
    restart: unless-stopped
    logging: *logging
    environment:
      HTTPS_PROXY: ${BUILD_PROXY:-}
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
      certbot renew --quiet --authenticator webroot --webroot-path /var/www/certbot;
      sleep 12h & wait $${!};
      done"
    networks: [internal]

# Only nginx-proxy publishes ports (80/443). Backend, bot and frontend are reachable
# only inside the "internal" network, so Docker cannot bypass the UFW rules for them.
networks:
  internal:

volumes:
  coregsm-data:
