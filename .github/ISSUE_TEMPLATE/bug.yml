name: Ошибка
description: Что-то работает не так
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Что случилось
      description: Что вы делали, что ожидали и что получили. Скриншот поможет.
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Версия панели
      description: Команда `coregsm status` или раздел «Система» в панели
  - type: dropdown
    id: where
    attributes:
      label: Где
      options: [Панель (веб), Discord-бот, Установка / обновление, Другое]
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Журнал
      description: "`coregsm logs` или `coregsm doctor`. Уберите токены и пароли."
      render: shell
