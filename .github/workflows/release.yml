name: release

# Publishes the installer as a GitHub Release, ONLY when started by hand (Actions → release → Run workflow, or
# `gh workflow run release.yml`). Servers update from the newest release (tools/coregsm.sh and the panel's own check),
# not from the tip of main, so nothing reaches them until a release is cut. The text of the release is the section of
# CHANGELOG.md for the version in version.txt (Russian, then English; tools/release-notes.mjs): the workflow stops when
# that section is missing.
#
# Assets of a release:
#   install.sh         the generated installer (the same file as in the repository)
#   version.txt        build id and SHA-256 of install.sh
#   install.sh.bundle  keyless Sigstore signature of install.sh, made here; `coregsm update` checks it with cosign when
#                      cosign is installed on the server (identity: this workflow on main, issuer: GitHub Actions)
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SHA }}

      - name: Plan (CI green for this commit, CHANGELOG section present, no release yet)
        id: plan
        run: |
          set -e
          publish=true
          bad="$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" --jq '[.check_runs[] | select(.name != "publish") | select(.status != "completed" or (.conclusion != "success" and .conclusion != "skipped"))] | length')"
          if [ "$bad" != "0" ]; then echo "CI is not green for $SHA ($bad checks not finished or failed)"; exit 1; fi
          build="$(sed -n 's/^build=//p' version.txt)"
          version="$(sed -n 's/^version=//p' version.txt)"
          if [ -z "$build" ] || [ -z "$version" ]; then echo "version.txt has no build id or version"; exit 1; fi
          node tools/release-notes.mjs "$version" CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then echo "CHANGELOG.md has no section '## $version'. Move «Не выпущено» under that heading first."; exit 1; fi
          if gh release view "build-$build" >/dev/null 2>&1; then echo "release build-$build exists"; publish=false; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: install.sh and version.txt must match what the sources build
        if: steps.plan.outputs.publish == 'true'
        run: |
          bash tools/build-installer.sh
          git -c core.fileMode=false diff --exit-code -- install.sh version.txt
          bash -n install.sh

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        if: steps.plan.outputs.publish == 'true'

      - name: Sign install.sh
        if: steps.plan.outputs.publish == 'true'
        run: cosign sign-blob --yes --bundle install.sh.bundle install.sh

      - name: SBOM (CycloneDX, from the lock files of the three packages)
        if: steps.plan.outputs.publish == 'true'
        run: |
          set -e
          docker run --rm -v "$PWD/src:/src:ro" anchore/syft:v1.18.1 dir:/src --exclude '**/node_modules/**' -o cyclonedx-json > sbom.cdx.json
          test -s sbom.cdx.json
          cosign sign-blob --yes --bundle sbom.cdx.json.bundle sbom.cdx.json

      - name: Provenance of the installer
        if: steps.plan.outputs.publish == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: install.sh

      - name: Publish the release
        if: steps.plan.outputs.publish == 'true'
        run: |
          set -e
          gh release create "build-${{ steps.plan.outputs.build }}" install.sh version.txt install.sh.bundle sbom.cdx.json sbom.cdx.json.bundle \
            --target "$SHA" --title "Версия ${{ steps.plan.outputs.version }}" --notes-file notes.md --latest

  # The same sources as container images in the registry of GitHub: ghcr.io/<owner>/coregsm-<backend|bot|frontend|nginx>, tagged with
  # the version and with the build id, signed keyless (cosign, the identity of this workflow). The installer does not use them yet: they
  # are there so that a later installer can pull ready images instead of building on the server. A failure here never fails the release
  # (the installer above is what servers update from).
  images:
    needs: publish
    if: needs.publish.outputs.publish == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      SHA: ${{ github.sha }}
      VERSION: ${{ needs.publish.outputs.version }}
      BUILD: ${{ needs.publish.outputs.build }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SHA }}

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Build, push and sign the four images
        run: |
          set -e
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for pair in backend:core-backend bot:core-bot frontend:core-frontend nginx:nginx; do
            name="${pair%%:*}"
            dir="src/${pair##*:}"
            img="ghcr.io/$owner/coregsm-$name"
            docker buildx build "$dir" --push               --tag "$img:$VERSION" --tag "$img:build-$BUILD"               --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"               --label "org.opencontainers.image.revision=$SHA"               --label "org.opencontainers.image.version=$VERSION"               --metadata-file "meta-$name.json"
            digest="$(node -p "require('./meta-$name.json')['containerimage.digest']")"
            test -n "$digest"
            cosign sign --yes "$img@$digest"
            echo "$img@$digest" >> images.txt
          done
          cat images.txt
