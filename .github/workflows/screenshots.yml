name: screenshots

# Photographs the panel on demo data (real backend on a throwaway database, real login) and pushes the PNG files to
# the branch `ci-screenshots`, so a change to the interface can be looked at without a server. Runs on a push to a
# branch named `ui/**` or by hand. The pictures of `main` go to `ci-screenshots-main` and are the baseline: every other
# run compares against it (DIFF.md and marked pictures in diff/) and lists accessibility findings (A11Y.md, axe-core).
on:
  push:
    branches: ['ui/**', main]
  # a pull request that touches the interface gets a comment with before / after pictures
  pull_request:
    paths: ['src/core-frontend/**', 'tools/screenshots/**']
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the backend and the frontend
        run: |
          npm ci --no-audit --no-fund --prefix src/core-backend
          npm ci --no-audit --no-fund --prefix src/core-frontend
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm install --no-audit --no-fund playwright @axe-core/playwright pixelmatch pngjs
          npx playwright install --with-deps chromium
      - name: Start the backend and the panel
        run: |
          mkdir -p /tmp/shots-data
          cd src/core-backend
          PORT=3000 DB_PATH=/tmp/shots-data/coregsm.db DATA_DIR=/tmp/shots-data JWT_SECRET=$(head -c 48 /dev/zero | tr '\0' j) INTERNAL_TOKEN=$(head -c 48 /dev/zero | tr '\0' i) SETUP_TOKEN=shots-code POLL_INTERVAL_SEC=3600 NODE_ENV=test nohup node --import tsx src/index.ts > /tmp/backend.log 2>&1 &
          cd ../core-frontend
          nohup npx vite --port 5173 --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:3000/api/setup/status >/dev/null && curl -fs http://127.0.0.1:5173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/backend.log /tmp/vite.log; exit 1
      - name: Take the screenshots
        run: |
          sleep 8   # the first poll of the (unreachable) demo servers must finish before the demo data is written
          if ! node tools/screenshots/shoot.mjs http://127.0.0.1:5173 http://127.0.0.1:3000 /tmp/shots-data/coregsm.db /tmp/pw /tmp/shots > /tmp/shoot.log 2>&1; then
            { cat /tmp/shoot.log; echo '--- backend'; tail -n 20 /tmp/backend.log; } > /tmp/err.txt
            msg=$(tail -c 3500 /tmp/err.txt | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
            echo "::error title=screenshots::$msg"
            exit 1
          fi
          cat /tmp/shoot.log
      - name: Compare with main
        if: github.ref_name != 'main'
        continue-on-error: true
        run: |
          if git ls-remote --exit-code --heads origin ci-screenshots-main >/dev/null 2>&1; then
            rm -rf /tmp/base && mkdir /tmp/base && cd /tmp/base && git init -q && git fetch -q --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots-main && git checkout -q FETCH_HEAD
            git -C /tmp/base rev-parse HEAD > /tmp/base-sha
            cd "$GITHUB_WORKSPACE" && node tools/screenshots/compare.mjs /tmp/pw /tmp/shots /tmp/base /tmp/shots-diff/diff && cp /tmp/shots-diff/DIFF.md /tmp/shots-diff/changed.json /tmp/shots/ && cp -r /tmp/shots-diff/diff /tmp/shots/diff
          else
            echo 'no baseline yet (ci-screenshots-main)'
          fi
      - name: Push the pictures to ci-screenshots
        run: |
          set -e
          target=ci-screenshots; [ "$GITHUB_REF_NAME" = main ] && target=ci-screenshots-main
          [ "${{ github.event_name }}" = pull_request ] && target=ci-screenshots-pr-${{ github.event.pull_request.number }}
          rm -rf /tmp/out && mkdir /tmp/out && cp /tmp/shots/*.png /tmp/shots/*.md /tmp/out/ 2>/dev/null || cp /tmp/shots/*.png /tmp/out/
          [ -d /tmp/shots/diff ] && cp -r /tmp/shots/diff /tmp/out/diff
          cd /tmp/out
          printf 'Built from %s (%s)\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > README.txt
          git init -q -b "$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Screenshots of $GITHUB_REF_NAME $GITHUB_SHA"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/$target
          git rev-parse HEAD > /tmp/pushed-sha
      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f /tmp/base-sha ] || { echo 'no baseline, no comment'; exit 0; }
          node tools/screenshots/pr-comment.mjs "${{ github.repository }}" "$(cat /tmp/base-sha)" "$(cat /tmp/pushed-sha)" /tmp/shots/changed.json /tmp/comment.md
          pr=${{ github.event.pull_request.number }}
          id=$(gh api "repos/${{ github.repository }}/issues/$pr/comments" --paginate --jq '.[] | select(.body | contains("<!-- screenshots-diff -->")) | .id' | head -n1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@/tmp/comment.md >/dev/null
          else gh api -X POST "repos/${{ github.repository }}/issues/$pr/comments" -F body=@/tmp/comment.md >/dev/null; fi
