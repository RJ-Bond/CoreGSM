name: ci

# Typecheck everything, run the API tests against a real backend on a throwaway database, the bot tests
# and the frontend unit tests. The generated installer is checked by check-installer.yml.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/core-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/core-backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/typecheck.log || { echo "::error title=backend typecheck::$(head -c 1500 /tmp/typecheck.log | tr '\n' ' ')"; exit 1; }
      - name: API and embed tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.log || { echo "::error title=backend tests::$(grep -E '^\s*(not ok|# Subtest|error:|expected|actual|\+|-) |AssertionError|Error:' /tmp/test.log | head -c 1800 | tr '\n' ' ')"; exit 1; }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/core-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/core-frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests and coverage floor
        run: npm run coverage
      - name: Lint (oxlint ratchet)
        # oxlint still has old findings (its static a11y rules flag patterns that axe accepts): the step fails only when
        # a rule reports more findings than lint-baseline.json allows, so the number can only go down
        run: npm run lint:ratchet
      - name: Build
        run: npx vite build

  bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/core-bot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/core-bot/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: No secrets or local databases committed
        run: |
          set -e
          if git ls-files | grep -E '(^|/)(\.env|.*\.db|.*\.sqlite)$'; then echo 'forbidden file committed'; exit 1; fi
          if git grep -nE '(discord(app)?\.com/api/webhooks/[0-9]+/[A-Za-z0-9_-]{20,}|[MN][A-Za-z0-9]{23,25}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{27,})' -- . ':!tests' ':!docs'; then echo 'looks like a Discord token or webhook'; exit 1; fi
      - name: UI rules that prevent the Chrome black-square flash
        run: |
          set -e
          # no fixed full-screen wash layer and no outline restyling on :focus
          if awk '/body::before[[:space:]]*\{/{b=1} b&&/position:[[:space:]]*fixed/{print FILENAME": "FNR": "$0; f=1} b&&/\}/{b=0} END{exit !f}' src/core-frontend/src/index.css; then echo 'body::before fixed wash layer is back'; exit 1; fi
          grep -q ':focus, :focus-visible { outline: 0 !important; }' src/core-frontend/src/index.css

  # The images are what actually runs: this catches a base image or a native module (better-sqlite3, skia-canvas)
  # that no longer builds or loads, which the tests on the runner do not.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the backend, bot and frontend images
        run: |
          set -e
          for part in core-backend core-bot core-frontend; do
            docker build -t "coregsm-$part:ci" "src/$part"
          done
      - name: The nginx configuration is valid (nginx -t on the rendered template)
        run: |
          set -e
          mkdir certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=panel.example.test" -keyout certs/privkey.pem -out certs/fullchain.pem 2>/dev/null
          docker build -t coregsm-nginx:ci src/nginx
          docker run --rm -e DOMAIN=panel.example.test -v "$PWD/certs:/etc/letsencrypt/live/panel.example.test:ro" --entrypoint sh coregsm-nginx:ci -c 'envsubst "\$DOMAIN" < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -t'
      - name: The backend starts with a read-only root filesystem and draws a picture
        run: |
          set -e
          docker volume create smoke-data >/dev/null
          docker run -d --name smoke --read-only --tmpfs /tmp:size=64m,mode=1777 --tmpfs /home/node/.cache:size=32m,uid=1000,gid=1000,mode=755 \
            --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 512 -v smoke-data:/data \
            -e PORT=3000 -e DB_PATH=/data/coregsm.db -e TMPDIR=/data/tmp -e DOMAIN=localhost \
            -e JWT_SECRET="$(openssl rand -hex 32)" -e INTERNAL_TOKEN="$(openssl rand -hex 32)" coregsm-core-backend:ci
          ok=0
          for i in $(seq 1 40); do
            if docker exec smoke node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then ok=1; break; fi
            sleep 2
          done
          docker logs smoke 2>&1 | tail -20
          test "$ok" = 1
          docker exec smoke node -e "fetch('http://127.0.0.1:3000/api/og/default.png').then(async r=>{const b=Buffer.from(await r.arrayBuffer());process.exit(r.ok&&b.length>1000?0:1)}).catch(()=>process.exit(1))"
          docker rm -f smoke >/dev/null
      - name: Backend image loads its native modules
        run: docker run --rm --entrypoint node coregsm-core-backend:ci -e "require('better-sqlite3'); require('skia-canvas'); console.log('native modules ok')"
      - name: Scan the images for known vulnerabilities (Trivy)
        # a CRITICAL finding that has a fix fails the build; fixable HIGH ones are listed in the job summary
        run: |
          fail=0
          for part in core-backend core-bot core-frontend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image --quiet --severity HIGH,CRITICAL --ignore-unfixed --format table "coregsm-$part:ci" > "/tmp/trivy-$part.txt" 2>&1 || true
            { echo "### $part"; echo '```'; head -c 6000 "/tmp/trivy-$part.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            if docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image --quiet --severity CRITICAL --ignore-unfixed --exit-code 1 --format json "coregsm-$part:ci" > /dev/null 2>&1; then :; else
              echo "::error title=Trivy::$part has a fixable CRITICAL vulnerability, see the job summary"; fail=1
            fi
          done
          exit $fail
