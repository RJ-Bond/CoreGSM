name: ci

# Typecheck everything, run the API tests against a real backend on a throwaway database, the bot tests
# and the frontend unit tests. The generated installer is checked by check-installer.yml.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/core-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/core-backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/typecheck.log || { echo "::error title=backend typecheck::$(head -c 1500 /tmp/typecheck.log | tr '\n' ' ')"; exit 1; }
      - name: API and embed tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.log || { echo "::error title=backend tests::$(grep -E '^\s*(not ok|# Subtest|error:|expected|actual|\+|-) |AssertionError|Error:' /tmp/test.log | head -c 1800 | tr '\n' ' ')"; exit 1; }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/core-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/core-frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx vite build

  bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/core-bot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/core-bot/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No secrets or local databases committed
        run: |
          set -e
          if git ls-files | grep -E '(^|/)(\.env|.*\.db|.*\.sqlite)$'; then echo 'forbidden file committed'; exit 1; fi
          if git grep -nE '(discord(app)?\.com/api/webhooks/[0-9]+/[A-Za-z0-9_-]{20,}|[MN][A-Za-z0-9]{23,25}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{27,})' -- . ':!tests' ':!docs'; then echo 'looks like a Discord token or webhook'; exit 1; fi
      - name: UI rules that prevent the Chrome black-square flash
        run: |
          set -e
          # no fixed full-screen wash layer and no outline restyling on :focus
          if awk '/body::before[[:space:]]*\{/{b=1} b&&/position:[[:space:]]*fixed/{print FILENAME": "FNR": "$0; f=1} b&&/\}/{b=0} END{exit !f}' src/core-frontend/src/index.css; then echo 'body::before fixed wash layer is back'; exit 1; fi
          grep -q ':focus, :focus-visible { outline: 0 !important; }' src/core-frontend/src/index.css

  # The images are what actually runs: this catches a base image or a native module (better-sqlite3, skia-canvas)
  # that no longer builds or loads, which the tests on the runner do not.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the backend, bot and frontend images
        run: |
          set -e
          for part in core-backend core-bot core-frontend; do
            docker build -t "coregsm-$part:ci" "src/$part"
          done
      - name: Backend image loads its native modules
        run: docker run --rm --entrypoint node coregsm-core-backend:ci -e "require('better-sqlite3'); require('skia-canvas'); console.log('native modules ok')"
