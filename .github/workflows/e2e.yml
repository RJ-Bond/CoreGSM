name: e2e

# Real browser, real backend on a throwaway database: sign-in, add a server, publish news, comment, report, and a
# sweep of the pages for script errors (tools/e2e/run.mjs). A separate job, so a flaky browser never blocks the unit tests.
# When a scenario fails, its picture goes to the branch `ci-e2e`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the backend and the frontend
        run: |
          npm ci --no-audit --no-fund --prefix src/core-backend
          npm ci --no-audit --no-fund --prefix src/core-frontend
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Start the backend and the panel
        run: |
          mkdir -p /tmp/e2e-data
          cd src/core-backend
          PORT=3000 DB_PATH=/tmp/e2e-data/coregsm.db DATA_DIR=/tmp/e2e-data JWT_SECRET=$(head -c 48 /dev/zero | tr '\0' j) INTERNAL_TOKEN=$(head -c 48 /dev/zero | tr '\0' i) SETUP_TOKEN=shots-code POLL_INTERVAL_SEC=3600 NODE_ENV=test nohup node --import tsx src/index.ts > /tmp/backend.log 2>&1 &
          cd ../core-frontend
          nohup npx vite --port 5173 --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:3000/api/setup/status >/dev/null && curl -fs http://127.0.0.1:5173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/backend.log /tmp/vite.log; exit 1
      - name: Run the scenarios
        run: |
          sleep 5
          node tools/e2e/run.mjs http://127.0.0.1:5173 http://127.0.0.1:3000 /tmp/e2e-data/coregsm.db /tmp/pw /tmp/e2e-out || { echo '--- backend'; tail -n 30 /tmp/backend.log; exit 1; }
      - name: Keep the pictures of failed scenarios
        if: failure()
        continue-on-error: true
        run: |
          cd /tmp/e2e-out && ls *.png >/dev/null 2>&1 || exit 0
          printf 'Built from %s (%s)\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > README.txt
          git init -q -b ci-e2e && git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A && git commit -q -m "e2e failures of $GITHUB_SHA"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-e2e
