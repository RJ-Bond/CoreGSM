name: update-deps

# One-off helper. Push a branch named update-deps/<name> with a file .github/update-deps.packages, one line per part:
#   core-backend bcryptjs@3 @types/nodemailer@8
# The job installs the packages, runs the same checks as ci.yml for each part, rebuilds install.sh and pushes the
# result to <branch>-result. Open a pull request from that branch. Commits made with GITHUB_TOKEN do not start other
# workflows, which is why the checks run inside this job. Remove this file when the updates are done.
on:
  push:
    branches: ['update-deps/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the listed packages and check each part
        run: |
          note() { # $1 = title, $2 = file: the tail of the output as an annotation
            msg=$(tail -c 3500 "$2" | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$1::$msg"
          }
          fail=0
          while read -r dir pkgs; do
            [ -n "$dir" ] || continue
            echo "::group::$dir: $pkgs"
            cd "src/$dir"
            npm ci --no-audit --no-fund > /tmp/ci.txt 2>&1 || { note "$dir npm ci" /tmp/ci.txt; exit 1; }
            # shellcheck disable=SC2086
            npm install --no-audit --no-fund $pkgs > /tmp/inst.txt 2>&1 || { note "$dir npm install" /tmp/inst.txt; exit 1; }
            npm run typecheck > /tmp/tc.txt 2>&1 || { note "$dir typecheck" /tmp/tc.txt; fail=1; }
            npm test > /tmp/test.txt 2>&1 || { note "$dir tests" /tmp/test.txt; fail=1; }
            if [ "$dir" = core-frontend ]; then npx vite build > /tmp/build.txt 2>&1 || { note "$dir build" /tmp/build.txt; fail=1; }; fi
            npm audit --omit=dev --audit-level=high || echo "::warning::npm audit reports high findings in $dir"
            cd ../..
            echo "::endgroup::"
          done < .github/update-deps.packages
          exit $fail
      - name: Rebuild install.sh
        run: bash tools/build-installer.sh
      - name: Push result branch
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "${GITHUB_REF_NAME}-result"
          git add -A
          git commit -m "Update dependencies: $(tr '\n' ';' < .github/update-deps.packages)"
          git push --force -u origin "${GITHUB_REF_NAME}-result"
