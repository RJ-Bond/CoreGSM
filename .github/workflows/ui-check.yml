name: ui-check

# The panel on a phone and a desktop, dark and light: tools/shots/run.mjs starts a demo stack, drives the Chrome of
# the runner and checks the pages (script errors, horizontal scroll, small tap targets, axe WCAG A/AA).
# A failed check (script error, horizontal scroll, small tap target, axe violation) fails the job.
on:
  push:
    branches: [main]
    paths: ['src/core-frontend/**', 'src/core-backend/**', 'tools/shots/**', '.github/workflows/ui-check.yml']
  pull_request:
    paths: ['src/core-frontend/**', 'src/core-backend/**', 'tools/shots/**', '.github/workflows/ui-check.yml']
  workflow_dispatch:

concurrency:
  group: ui-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  ui-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install the backend and the frontend
        run: |
          npm ci --no-audit --no-fund --prefix src/core-backend
          npm ci --no-audit --no-fund --prefix src/core-frontend
      - name: Shoot the pages
        run: node tools/shots/run.mjs --pages=all --viewports=phone,desktop --themes=dark,light --out=shots-out
      - name: The pictures of the last good run on main (what the Ember look is compared with)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --workflow ui-check --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$id" ]; then gh run download "$id" -n ember-pictures -D baseline-ember || true; fi
      - name: Shoot the main pages in the Ember look
        run: SHOTS_LOOK=ember node tools/shots/run.mjs --pages=servers,servers-list,server,news,status,community,login,profile,ui-kit,admin-start,admin-servers --viewports=phone,desktop --themes=dark,light --compare=baseline-ember --out=shots-out-ember
      - name: Keep the pictures of the Ember look
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ember-pictures
          path: shots-out-ember/**/*.png
          retention-days: 14
          if-no-files-found: ignore
      - name: Show the report of the Ember look
        if: always()
        run: cat shots-out-ember/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Show the report
        if: always()
        run: cat shots-out/report.md >> "$GITHUB_STEP_SUMMARY" || true
