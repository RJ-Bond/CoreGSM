name: audit

# Known vulnerabilities in the dependencies that end up in production (devDependencies are left out). Runs every Monday
# and whenever a lock file changes. It is a separate workflow so that a new advisory does not block unrelated pull
# requests in ci.yml; a red run here is the signal to update the package.
on:
  schedule:
    - cron: '17 5 * * 1'
  pull_request:
    paths:
      - 'src/*/package-lock.json'
      - '.github/workflows/audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core-backend, core-bot, core-frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: npm audit (production dependencies, high and critical)
        working-directory: src/${{ matrix.package }}
        run: |
          set +e
          npm audit --omit=dev --audit-level=high > audit.txt 2>&1
          rc=$?
          cat audit.txt
          if [ "$rc" -ne 0 ]; then
            # the report is also put into an annotation and the run summary, so it can be read without opening the raw log
            { echo '### npm audit: ${{ matrix.package }}'; echo '```'; head -c 6000 audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            msg=$(head -c 3500 audit.txt | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
            echo "::error title=npm audit failed (exit $rc)::$msg"
          fi
          exit "$rc"
